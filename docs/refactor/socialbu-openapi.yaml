                  required: true

    /insights/accounts/engagement/rate:
        get:
            tags:
                - Insights
            summary: Get total engagement rate.
            description: |
                Returns the overall engagement rate calculated as `(total engagements / total followers) * 100` across all accessible accounts.

                **Engagement** is the sum of all post-level engagement metrics across every post recorded for the account.
                The following metric types count as engagement:
                `likes`, `comments`, `reactions`, `shares`, `replies`, `retweets`, `quote_tweets`,
                `reblogs`, `favourites`, `total_interactions`, `score`, `saved`, `reposts`, `quotes`,
                `pin_clicks`, `bookmarks`.

                Networks that contribute engagement data (any network with post metrics):
                **Facebook Page** (`reactions`, `comments`, `shares`),
                **Instagram** (`likes`, `comments`, `saved`, `shares`, `total_interactions`, `replies`),
                **Twitter/X** (`likes`, `retweets`, `quote_tweets`, `replies`, `bookmarks`),
                **LinkedIn Org/Brand/Profile** (`likes`, `comments`, `shares`),
                **YouTube** (`likes`, `comments`),
                **Pinterest** (`saved`, `pin_clicks`, `reactions`, `comments`),
                **Threads** (`likes`, `replies`, `reposts`, `quotes`),
                **Bluesky** (`likes`, `replies`, `reposts`),
                **Mastodon** (`replies`, `reblogs`, `favourites`),
                **Reddit** (`comments`, `score`).

                **Followers** for the denominator are taken from the same audience-size metrics as `/insights/accounts/followers`
            operationId: getEngagementRate
            responses:
                '404':
                    description: Resource not found
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            total_engagement_rate:
                                                type: number
                                                format: float
                                                description: The total engagement rate as a percentage, rounded to 2 decimal places.
                                            last_fetched_at:
                                                type: string
                                                format: date-time
                                                nullable: true
                                                description: When the underlying engagement metrics were last fetched, or null if none have been fetched.

    /insights/accounts/engagement/trend:
        get:
            tags:
                - Insights
            summary: Get engagement trend over time.
            description: |
                Returns the daily total engagements across all accessible accounts within the specified date range.

                Uses the same engagement metric types as `/insights/accounts/engagement/rate`:
                `likes`, `comments`, `reactions`, `shares`, `replies`, `retweets`, `quote_tweets`,
                `reblogs`, `favourites`, `total_interactions`, `score`, `saved`, `reposts`, `quotes`,
                `pin_clicks`, `bookmarks`.

                Data is aggregated from post metrics across all networks that support post-level tracking:
                **Facebook Page**, **Instagram**, **Twitter/X**, **LinkedIn** (Org, Brand, Profile),
                **YouTube**, **Pinterest**, **Threads**, **Bluesky**, **Mastodon**, **Reddit**.
                TikTok and Google Business Location do not contribute (no post metrics tracked).
            operationId: getEngagementTrend
            responses:
                '404':
                    description: Resource not found
                '422':
                    description: Validation error
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        description: An array of daily engagement data.
                                        items:
                                            type: object
                                            properties:
                                                date:
                                                    type: string
                                                    format: date
                                                    description: The specific date for which the engagement is reported.
                                                engagements:
                                                    type: integer
                                                    description: Total number of engagements (likes, comments, shares, etc.) across all accounts on this date.
                                    last_fetched_at:
                                        type: string
                                        format: date-time
                                        nullable: true
                                        description: When the underlying engagement metrics were last fetched, or null if none have been fetched.
            parameters:
                - name: start
                  in: query
                  description: The start date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d
                - name: end
                  in: query
                  description: The end date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d. Must be greater than start date.

