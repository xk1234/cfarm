            description: |
                Returns the total followers count across all accessible accounts and followers count per account.

                Covers all networks that track an audience size metric:
                **Instagram**, **Twitter/X**, **TikTok**, **Bluesky**, **Mastodon**, **Pinterest**, **LinkedIn Org**, **LinkedIn Brand**,
                **Facebook Page**, **YouTube**, **Threads**.

            operationId: getAllFollowers
            responses:
                '404':
                    description: Resource not found
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            total_followers:
                                                type: integer
                                                description: Total number of followers across all accounts.
                                            followers_by_account:
                                                type: array
                                                description: An array of follower counts per account.
                                                items:
                                                    type: object
                                                    properties:
                                                        account_id:
