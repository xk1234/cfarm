                  in: query
                  required: false
                  description: Filter conversations by status.
                  schema:
                      type: string
                      enum:
                          - open
                          - pending
                          - closed
                          - spam
                - name: post_id
                  in: query
                  required: false
                  description: Filter conversations whose external_id matches this platform post ID.
                  schema:
                      type: string
                - name: assigned_to
                  in: query
                  required: false
                  description: Filter by assignment. Use `mine`, `unassigned`, `assigned`, or a user ID.
                  schema:
                      type: string
                - name: start
                  in: query
                  required: false
                  description: Include conversations updated on or after this date/time.
                  schema:
                      type: string
                      format: date-time
                - name: end
                  in: query
                  required: false
                  description: Include conversations updated on or before this date/time.
                  schema:
                      type: string
                      format: date-time
                - name: item_types
                  in: query
                  required: false
                  description: Filter conversations containing one or more inbox item types.
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: string
                - name: account_types[]
                  in: query
                  required: false
                  description: Filter conversations by one or more connected account types, such as `facebook.page`, `instagram.api`, or `bluesky.profile`.
                  style: form
                  explode: true
                  schema:
                      type: array
                      items:
                          type: string
                - name: unread
                  in: query
                  required: false
                  description: When true, return only conversations containing qualifying unread inbound items.
                  schema:
                      type: boolean
                - name: q
                  in: query
                  required: false
                  description: Search contact name, username, or item content.
                  schema:
                      type: string
            responses:
                '200':
                    description: Conversations retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InboxPaginatedConversationsResponse'
