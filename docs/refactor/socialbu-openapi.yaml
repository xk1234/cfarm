    /insights/posts/best-day:
        get:
            tags:
                - Insights
            summary: Find the strongest observed weekday for published posts.
            description: |
                Uses posts published on the requested calendar dates in the authenticated user's timezone and each post's latest available metrics. A zero engagement rate is measured only with a positive denominator. The weekday with the highest average per-post engagement rate returns `ready` with at least three measured posts on that day, three across other days, a 10% relative lift, and a 0.5 percentage-point absolute lift over the pooled other-day average, with no tie for first place. If either post-count minimum is not met, measured posts on at least two different weekdays can return `early_result` with the same lift and no-tie checks. Only weekdays with measured posts are compared. Early results describe the selected period and do not guarantee future performance. Empty `accounts` uses all owned and Analytics-permitted shared accounts in the selected team or workspace, including disconnected accounts with historical data; one account returns account scope, and multiple accounts are pooled per post. Requests are limited to 200 days and 25,000 matching posts.
            operationId: getBestPostingDay
            parameters:
                - name: start
                  in: query
                  required: true
                  description: First local calendar date, inclusive.
                  schema:
                      type: string
                      format: date
                - name: end
                  in: query
                  required: true
                  description: Last local calendar date, inclusive.
                  schema:
                      type: string
                      format: date
                - name: team
                  in: query
                  description: Team ID; requires approved membership and `analyze.view`.
                  schema:
                      type: integer
                - name: accounts
                  in: query
                  description: Optional account IDs, all of which must be available in the selected scope.
                  schema:
                      type: array
                      items:
                          type: integer
            responses:
                '200':
                    description: Recommendation or explicit reason it cannot be made.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        required: [start, end, timezone, evaluated_at, scope, account_ids, metric, total_posts, measured_posts, status, best_day, weekdays]
                                        properties:
                                            start:
                                                type: string
                                                format: date
                                            end:
                                                type: string
                                                format: date
                                            timezone:
                                                type: string
                                            evaluated_at:
                                                type: string
                                                format: date-time
                                            scope:
                                                type: string
                                                enum: [none, account, combined]
                                            account_ids:
                                                type: array
                                                items:
                                                    type: integer
                                            metric:
                                                type: string
                                                enum: [engagement_rate]
                                            total_posts:
                                                type: integer
                                            measured_posts:
                                                type: integer
                                            status:
                                                type: string
                                                enum: [ready, early_result, no_accounts, no_posts, no_measured_posts, insufficient_data, no_clear_winner]
                                            best_day:
                                                nullable: true
                                                allOf:
                                                    - $ref: '#/components/schemas/BestPostingWeekday'
                                            comparison_average_rate:
                                                type: number
                                                nullable: true
                                            lift_percentage_points:
                                                type: number
                                                nullable: true
                                            lift_percent:
                                                type: number
                                                nullable: true
                                            weekdays:
                                                type: array
                                                minItems: 7
                                                maxItems: 7
                                                items:
                                                    $ref: '#/components/schemas/BestPostingWeekday'
                '403':
                    description: The authenticated user lacks Analytics permission for the team.
                '404':
                    description: The selected team is not in the user's approved memberships.
                '422':
                    description: Invalid dates, unavailable selected accounts, or report size limit exceeded.
                '429':
                    description: Rate limit exceeded.
                '503':
                    description: Insights metrics are temporarily unavailable.


    /insights/posts/metrics:
        get:
            tags:
                - Insights
            summary: Get various metrics for posts within a specified time frame.
            description: Returns post metric snapshots grouped by calendar date in the authenticated user's timezone for selected metric types. Published posts and metric samples are limited to the selected local dates; `calculate_growth` retains its existing day-over-day semantics.
            operationId: getPostsMetrics
            responses:
                '404':
                    description: Resource not found
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        description: |
                                            Response shape depends on `group_by_account`.
                                            - When `group_by_account=false` (default), this is an object keyed by metric type.
                                            - When `group_by_account=true`, this is an array of account-wise metric objects.
                                        oneOf:
                                            - type: object
                                              additionalProperties:
                                                  type: array
                                                  items:
                                                      type: object
                                                      properties:
                                                          date:
                                                              type: string
                                                              format: date
                                                          value:
                                                              type: integer
                                                      required:
                                                          - date
                                                          - value
                                            - type: array
                                              items:
                                                  type: object
                                                  properties:
                                                      account_id:
                                                          type: integer
                                                          description: ID of the connected social media account.
                                                      metrics:
                                                          type: object
                                                          additionalProperties:
                                                              type: array
                                                              items:
                                                                  type: object
                                                                  properties:
                                                                      date:
                                                                          type: string
                                                                          format: date
                                                                      value:
                                                                          type: integer
                                                                  required:
                                                                      - date
                                                                      - value
                                                  required:
                                                      - account_id
                                                      - metrics

            parameters:
                - name: post_type
                  in: query
                  description: Filter by post type. If omitted, all post types are included.
                  schema:
                      type: string
                      enum:
                          - image
                          - video
                          - text
                - name: start
                  in: query
                  description: The start date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d
                - name: end
                  in: query
                  description: The end date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d
                - name: metrics
                  in: query
                  description: |
                        The metric types you want to fetch. Accepts either a comma-separated string
                        or repeated query parameters such as `metrics[]=impressions&metrics[]=engagement`.
                        Use `engagements` for a combined interaction series that excludes views and reach.
                        For each post, `total_interactions` takes precedence over its individual action metrics
                        when present in the queried samples (including the growth baseline). Otherwise, action
                        metrics such as likes, comments, replies, shares, and saves are combined. Daily growth
                        is calculated per source counter before combining. Missing total samples do not fall
                        back to components. Explicitly requested raw metrics are returned separately unchanged.
                        Supported post metrics for each network:

                        - **Facebook Page**:
                            - *All posts:* `reactions`, `comments`
                            - *Text posts:* `shares`
                            - *Non-video posts:* `media_view` (impressions), `clicks`
                            - *Video posts:* `video_views`, `video_views_paid`, `video_views_organic`, `video_complete_views`, `video_10s_views`, `video_avg_time_watched`, `avg_watch_time`, `video_view_time`, `total_plays`, `replay_count`, `impressions`, `impressions_paid`, `impressions_organic`, `impressions_fan`, `impressions_unique`
                            - Stories are not tracked.
                        - **Instagram**:
                            - *All posts:* `likes`, `comments`
                            - *Carousel posts:* `reach`, `saved`
                            - *Photo posts:* `reach`, `saved`
                            - *Video posts:* `reach`, `saved`
                            - *Reel posts:* `reach`, `saved`, `shares`, `total_interactions`
                            - *Story posts:* `reach`, `replies`
                        - **Twitter / X**: `bookmarks`, `retweets`, `likes`, `replies`, `quote_tweets`, `impressions`
                        - **LinkedIn Org & Brand**: `clicks`, `comments`, `engagement`, `impressions`, `likes`, `shares`, `unique_impressions`, `video_views` (video only)
                        - **LinkedIn Profile**: `comments`, `impressions`, `likes`, `shares`, `unique_impressions`
                        - **YouTube**: `views`, `likes`, `comments`
                        - **Pinterest**:
                            - *All posts:* `impressions`, `pin_clicks`, `saved`, `reactions`, `comments`
                            - *Video posts:* `video_views`, `video_avg_watch_time`, `video_10s_views`
                        - **Threads**: `views`, `likes`, `replies`, `reposts`, `quotes`
                        - **Bluesky**: `likes`, `replies`, `reposts`
                        - **Mastodon**: `replies`, `reblogs`, `favourites`
                        - **Reddit Profile & Subreddit**: `comments`, `score`
                        - **TikTok**: *(post metrics not supported)*
                        - **Google Business Location**: *(post metrics not supported)*

                  required: true
                  schema:
                      oneOf:
                          - type: string
                          - type: array
                            items:
                                type: string
                  examples:
                      instagramReach:
                          summary: Instagram reach and saves (all post types)
                          value: reach,saved
                      instagramReel:
                          summary: Instagram Reel-specific metrics
                          value: reach,saved,shares,total_interactions
                      facebookVideo:
                          summary: Facebook video post metrics
                          value: video_views,impressions,impressions_unique
                      commonMetrics:
                          summary: Common metrics available across multiple platforms
                          value: impressions,likes,comments
                - name: calculate_growth
                  in: query
                  description: |
                        Whether to return day-over-day deltas from cumulative metric values.
                        Defaults to true.
                  schema:
                      type: boolean
                      default: true
                - name: group_by_account
                  in: query
                  description: |
                        Whether to group the response by account.
                        - false (default): returns summed metrics across selected accounts.
                        - true: returns metrics per account.
                  schema:
                      type: boolean
                      default: false
                - name: accounts
                  in: query
                  description: An array of account IDs.
                  schema:
                      type: array
                      items:
                          type: integer
                - name: team
                  in: query
                  description: The team id.
                  schema:
                      type: integer


