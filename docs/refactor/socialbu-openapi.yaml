    /curation/items:
        get:
            tags:
                - Curation
            summary: Get curation items
            description: Returns a list curation items
            operationId: getItems
            responses:
                '400':
                    description: Bad Request
                '404':
                    description: Resource not found
                '405':
                    description: Validation exception
                '200':
                    description: successful operation id, feed_id, title, link, description, media, published_at, authors, tags, score.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/CurationItem'
                                    currentPage:
                                        type: integer
                                        description: The current page number of the paginated results.
                                    lastPage:
                                        type: integer
                                        description: The last page number of the paginated results.
                                    nextPage:
                                        type: integer
                                        description: The next page number, or null if this is the last page.
                                    total:
                                        type: integer
                                        description: Total number of result items.
            parameters:
                - name: page
                  in: query
                  description: The page number
                  schema:
                      type: integer
                - name: per_page
                  in: query
                  description: The number of items per page
                  schema:
                      type: integer
                - name: authors
                  in: query
                  description: The list of authors
                  schema:
                      type: array
                      items:
                          type: string
                - name: feed_id
                  in: query
                  description: The feed id
                  schema:
                      type: integer
                - name: search
                  in: query
                  description: Search curated item content by meaning.
                  schema:
                      type: string
                - name: sort
                  in: query
                  description: Sort order for vector search results. Only applies when search is provided. Defaults to relevance.
                  schema:
                      type: string
                      enum:
                          - relevance
                          - newest
                          - oldest
                - name: source_scope
                  in: query
                  description: Filter by source visibility. Use team with team_id to search a specific team source set.
                  schema:
                      type: string
                      enum:
                          - all
                          - global
                          - private
                          - team
                - name: team_id
                  in: query
                  description: Team id used when source_scope is team.
                  schema:
                      type: integer
                - name: time_range
                  in: query
                  description: Rolling time range to use when from/to are not provided.
                  schema:
                      type: string
                      enum:
                          - last_7_days
                          - last_14_days
                          - last_30_days
                          - last_3_months
                - name: layout
                  in: query
                  description: Presentation layout for the iframe.
                  schema:
                      type: string
                      enum:
                          - cards
                          - rows
                - name: from
                  in: query
                  description: Fixed start date. Format should be Y-m-d. Overrides time_range when provided.
                  schema:
                      type: string
                      format: date
                - name: to
                  in: query
                  description: Fixed end date. Format should be Y-m-d. Overrides time_range when provided.
                  schema:
                      type: string
                      format: date

