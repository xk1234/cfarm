    /listen/streams/{id}/activity:
        get:
            tags:
                - Social Listening
            summary: Fetch listening stream activity
            description: >-
                Returns daily counts for saved items in a social listening stream, split by matched
                keyword or platform. Archived items are included; deleted and retention-purged items are not.
                Dates without activity are omitted. Search and status filters do not apply.
                Defaults to the last 30 days.
            operationId: getListeningStreamActivity
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Listening stream ID.
                  schema:
                      type: integer
                - name: from
                  in: query
                  required: false
                  description: First day to include. Defaults to 29 days before `to`.
                  schema:
                      type: string
                      format: date
                      example: "2026-05-01"
                - name: group_by
                  in: query
                  required: false
                  description: Split activity by matched keyword or source platform.
                  schema:
                      type: string
                      enum:
                          - keyword
                          - platform
                      default: keyword
                - name: platform
                  in: query
                  required: false
                  description: Limit activity to one listening source.
                  schema:
                      type: string
                      enum:
                          - bluesky
                          - hackernews
                          - reddit
                          - threads
                          - tiktok
                          - twitter
                          - youtube
                - name: to
                  in: query
                  required: false
                  description: >-
                      Last day to include. Defaults to today. The range cannot exceed 90 days.
                  schema:
                      type: string
                      format: date
                      example: "2026-05-30"
            responses:
                '200':
                    description: Listening activity retrieved successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListeningActivityResponse'
                '403':
                    description: Social listening is not available on the current plan.
                '404':
                    description: Stream not found or not available to the authenticated user.
                '422':
                    description: The given data was invalid.


