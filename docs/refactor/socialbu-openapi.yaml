    '/posts/{postId}':
        get:
            tags:
                - Posts
            summary: Find post by ID
            description: Returns the full details of a single post, including its content, scheduled time, account associations, publish result, current status, and `reviewed_by` with `id`, `name`, and `action` (`approved` or `rejected`) when approval metadata is available.
            operationId: getPost
            parameters:
                - name: postId
                  in: path
                  description: ID of post to return
                  required: true
                  schema:
                      type: integer
            responses:
                '400':
                    description: Bad Request
                '404':
                    description: Resource not found
                '405':
                    description: Validation exception
                '200':
                    description: Post found
                    content:
                        application/json:
                            schema:
                                type: object
                                description: The post object.
                                additionalProperties: true
        delete:
            tags:
                - Posts
            summary: Deletes the post
            description: Deletes a scheduled, draft, or published post. Published posts are only deleted from SocialBu — they are not removed from the social network.
            operationId: deletePost
            parameters:
                - name: postId
                  in: path
                  description: Post id to delete
                  required: true
                  schema:
                      type: integer
            responses:
                '400':
                    description: Bad Request
                '404':
                    description: Resource not found
                '200':
                    description: Post deleted successfully. Response body is empty.
                '500':
                    description: Server error while deleting the post
        patch:
            tags:
                - Posts
            summary: Update the post
            description: |
                Updates a scheduled or draft post. Only the fields you provide are changed.

                Use this endpoint to update post content, schedule, draft state, processed network-specific `options`, attachments, or review status.

                Attachment updates are handled through `existing_attachments`:
                - Send `{ "upload_token": "..." }` for newly uploaded media you want to attach.
                - Send the full saved attachment object returned by `GET /posts/{postId}` to keep an attachment that is already on the post.
                - When `from=composer`, omitted `options` and `existing_attachments` are treated as empty arrays, so previously saved processed options or attachments are removed.

                To approve or reject a post awaiting team approval, use the `approved` field. To publish immediately without editing other fields, send `publish_now=true`.
                Reviewed post objects returned by this endpoint include `reviewed_by` with `id`, `name`, and `action` (`approved` or `rejected`) when approval metadata is available.
            operationId: updatePost
            parameters:
                - name: postId
                  in: path
                  description: Post id to update
                  required: true
                  schema:
                      type: integer
            responses:
                '400':
                    description: Bad Request
                '404':
                    description: Resource not found
                '422':
                    description: The given data was invalid.
                '200':
                    description: Post updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Indicates whether the post was updated successfully.
                                    post:
                                        type: object
                                        description: Updated post object.
                                        additionalProperties: true
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                publish_at:
                                    example: "2025-04-14 15:30:00"
                                    type: string
                                    description: New scheduled time in `Y-m-d H:i:s` UTC format. If a past time is sent, the server shifts it to the current time.
                                content:
                                    type: string
                                    nullable: true
                                    description: Updated post content. Can be `null` when the target network allows attachment-only posts.
                                draft:
                                    type: boolean
                                    description: Set to `true` to keep the post as a draft, or `false` to make it schedulable/publishable.
                                publish_now:
                                    type: boolean
                                    description: Publish the post immediately instead of applying a regular partial update.
                                reset_result:
                                    type: boolean
                                    description: Set to `true` to clear the stored publish result before republishing or rescheduling.
                                from:
                                    type: string
                                    enum:
                                        - composer
                                    description: |
                                        Special composer mode. When set to `composer`, omitted `options` and `existing_attachments`
                                        are treated as empty arrays so removed values are cleared from the saved post.
                                existing_attachments:
                                    type: array
                                    description: |
                                        Final attachment set for the post. This array accepts both newly uploaded media token objects
                                        and already-saved attachment objects returned by `GET /posts/{postId}`.
                                        Any previously attached media omitted from this array is removed. To keep an already-saved attachment,
                                        send back its full object including `path`. You can also send newly uploaded files with the same
                                        request using multipart form-data `attachments[]`.
                                    items:
                                        $ref: '#/components/schemas/PostUpdateExistingAttachment'
                                options:
                                    type: object
                                    description: |
                                        Public post options to update for the post's connected account. These are processed and merged with
                                        the post's internal options instead of replacing the entire stored options object. Supported keys vary
                                        by network and account type; use `GET /posts/supported-options` to discover valid fields.
                                    additionalProperties: true
                                approved:
                                    type: boolean
                                    description: |
                                        Approve or reject a post awaiting team approval.
                                        Set to `true` to approve, `false` to reject.
                                        Requires the `approvals.approve` permission in the team.
                                reject_reason:
                                    type: string
                                    description: Optional reason when rejecting a post (approved=false). Visible to the post author.
                                tags:
                                    type: array
                                    maxItems: 10
                                    description: >-
                                        ID(s) of existing tags to apply to the post (maximum 10, same scope rules
                                        as on create — see `POST /posts`). Omit this field entirely to leave the
                                        post's tags unchanged. Send an empty array to clear every tag.
                                    items:
                                        type: integer
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                publish_at:
                                    type: string
                                    example: "2025-04-14 15:30:00"
                                    description: New scheduled time in `Y-m-d H:i:s` UTC format.
                                content:
                                    type: string
                                    nullable: true
                                draft:
                                    type: boolean
                                publish_now:
                                    type: boolean
                                reset_result:
                                    type: boolean
                                from:
                                    type: string
                                    enum:
                                        - composer
                                attachments:
                                    type: array
                                    description: Newly uploaded media files to attach to the post.
                                    items:
                                        type: string
                                        format: binary
                                existing_attachments:
                                    type: array
                                    description: |
                                        Final attachment set for the post. This array accepts both newly uploaded media token objects
                                        and already-saved attachment objects returned by `GET /posts/{postId}`.
                                        To keep an already-saved attachment, send back its full object including `path`.
                                    items:
                                        $ref: '#/components/schemas/PostUpdateExistingAttachment'
                                options:
                                    type: object
                                    additionalProperties: true
                                    description: Network-specific public options for the target account.
                                approved:
                                    type: boolean
                                reject_reason:
                                    type: string
                                tags:
                                    type: array
                                    maxItems: 10
                                    description: >-
                                        ID(s) of existing tags to apply to the post (maximum 10). Repeat the field
                                        as `tags[]=<id>` for each tag.
                                    items:
                                        type: integer
                                tags_present:
                                    type: string
                                    description: >-
                                        Multipart form data can't represent an empty array, so an omitted `tags[]`
                                        is indistinguishable from "leave tags unchanged." Set this to `1` (with no
                                        `tags[]` entries) to explicitly clear every tag instead.

    '/posts/{postId}/publish':
        post:
            tags:
                - Posts
            summary: Publish a post now
            description: Converts the post to a non-draft, sets its publish time to now, clears any previous publish result, and triggers publishing immediately or queues it for publishing.
            operationId: publishPostNow
            parameters:
                - name: postId
                  in: path
                  description: Post id to publish immediately
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Post publish triggered successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    post:
                                        type: object
                                        properties:
                                            draft:
                                                type: boolean
                                            approved:
                                                type: boolean
                                            publish_at:
                                                type: string
                                            _published:
                                                type: boolean
                '400':
                    description: Bad Request
                '404':
                    description: Resource not found

    /posts/bulk_delete:
        post:
            tags:
                - Posts
            summary: Delete multiple posts
            description: Deletes multiple accessible posts by ID.
            operationId: bulkDeletePosts
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - ids
                            properties:
                                ids:
                                    type: array
                                    description: IDs of posts to delete.
                                    items:
                                        type: integer
            responses:
                '200':
                    description: Posts deleted successfully. Response body is empty.
                '400':
                    description: Bad Request
                '500':
                    description: Server error while deleting one of the posts


    /upload_media:
        post:
            tags:
                - Media Upload
            summary: Initiate media upload
            description: Generate a pre-signed URL to upload a media file.
            operationId: uploadMediaFile
            responses:
                '200':
                    description: file uploaded
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    name:
                                        type: string
                                        description: File name e.g, ("document.pdf" ,"image.png")
                                    mime_type:
                                        type: string
                                        description: File type e.g, ("application/pdf" ,"image/png")
                                    signed_url:
                                        type: string
                                        description: |
                                            This parameter provides a pre-signed URL to which you should upload your media file using the HTTP PUT method.

                                            To ensure a successful upload, you must set the following headers in your request:
                                            - `Content-Type`: Set this header to the MIME type of the file you are uploading (e.g., `image/jpeg`, `video/mp4`). This header informs the server about the type of the media content being uploaded.
                                            - `Content-Length`: Set this header to be the size of the file being uploaded (bytes).
                                            - `x-amz-acl`: Set this to `private`.
                                    key:
                                        type: string
                                        description: A unique identifier used to check the upload status.
                                    secure_key:
                                        type: string
                                        description: File secure key.
                                    url:
                                        type: string
                                        description: File public URL.
                '422':
                    description: The given data was invalid.
            requestBody:
                description: Send the file name and MIME type to generate a pre-signed URL and key.
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                                - mime_type
                            properties:
                                name:
                                    type: string
                                    description: File name e.g, ("document.pdf" ,"image.png")
                                mime_type:
                                    type: string
                                    description: File type e.g, ("application/pdf" ,"image/png")

    /upload_media_by_url:
        post:
            tags:
                - Media Upload
            summary: Upload media by URL
            description: |
                Upload a media file by providing an HTTP(S) URL or a base64 data URL. The server downloads HTTP(S) URLs and stores data URLs directly, returning an `upload_token` in a single step.

                This is simpler than the three-step signed URL flow — no separate upload or status check is needed. The `upload_token` returned can be used in `existing_attachments` when creating a post, the same as the token from the three-step flow.

                Supported file types: jpg, jpeg, png, gif, webp, mp4, mov, avi, webm, mkv, pdf. The maximum decoded file size is about 56 MiB. Base64 data URL payloads are limited to 75 MiB.
            operationId: uploadMediaByUrl
            requestBody:
                required: true
                description: HTTP(S) URL or base64 data URL of the media file, with an optional custom filename.
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - url
                            properties:
                                url:
                                    type: string
                                    maxLength: 78643264
                                    description: HTTP(S) URL to download or a base64 data URL. Base64 payloads are limited to 75 MiB.
                                name:
                                    type: string
                                    maxLength: 255
                                    description: Custom filename for the stored file. If not provided, the filename is extracted from the URL.
            responses:
                '200':
                    description: File uploaded successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Indicates whether the file was uploaded successfully.
                                    message:
                                        type: string
                                        description: A message confirming the media upload.
                                    name:
                                        type: string
                                        description: File name e.g, ("document.pdf", "image.png")
                                    mime_type:
                                        type: string
                                        description: File MIME type e.g, ("image/jpeg", "video/mp4")
                                    size:
                                        type: integer
                                        description: File size in bytes.
                                    key:
                                        type: string
                                        description: A unique storage key for the uploaded file.
                                    upload_token:
                                        type: string
                                        description: Pass this token value in existing_attachments when creating a post.
                                    url:
                                        type: string
                                        description: Preview URL of the uploaded file.
                '400':
                    description: Bad Request. Possible reasons — file too large (about 56 MiB decoded, or 75 MiB base64 payload), unsupported file type, empty file, invalid data URL, download failed, URL not found, or access denied.
                '422':
                    description: The given data was invalid. The `url` field is missing or malformed.
                '500':
                    description: Internal server error.

    /upload_media/status:
        get:
            tags:
                - Media Upload
            summary: Check media upload status
            description: Checks whether a media file has finished uploading to SocialBu's storage. Once `success` is `true`, use the returned `upload_token` in `existing_attachments` when creating a post.
            operationId: checkMediaStatus
            parameters:
                - name: key
                  in: query
                  description: The key value returned in /upload_media endpoint.
                  schema:
                      type: string
            responses:
                '200':
                    description: File status
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Indicates whether the file has been uploaded.
                                    message:
                                        type: string
                                        description: A message confirming the media upload.
                                    upload_token:
                                        type: string
                                        nullable: true
                                        description: Pass this token value in existing_attachments when creating a post.
                '400':
                    description: Bad Request
                '422':
                    description: The given data was invalid.


    /accounts:
        get:
            tags:
                - Accounts
            summary: Get social accounts
            description: Returns a paginated list of all social media accounts accessible to the authenticated user, including accounts shared via teams.
            operationId: getAccounts
            responses:
                '200':
                    description: Social accounts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        description: User's social media accounts.
                                    currentPage:
                                        type: integer
                                        description: The current page number of the paginated results.
                                    lastPage:
                                        type: integer
                                        description: The last page number of the paginated results.
                                    nextPage:
                                        type: integer
                                        description: The next page number, or null if this is the last page.
                                    total:
                                        type: integer
                                        description: Total number of results.
                '422':
                    description: The given data was invalid.
            parameters:
                - name: type
                  in: query
                  description: The type of accounts you want to fetch.
                  schema:
                      type: array
                      items:
                          type: string
                          enum:
                              - all
                              - user
                              - shared
                          default: all
        post:
            tags:
                - Accounts
            summary: Connect a new social account
            description: Initiates the OAuth connection flow for a new social media account. Returns a `connect_url` that should be opened in a browser popup. Optionally provide a `postback_url` to receive a webhook notification when the connection completes.
            operationId: connectAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - provider
                            properties:
                                provider:
                                    type: string
                                    description: Social media network name e.g, (Instagram, Twitter etc.)
                                postback_url:
                                    type: string
                                    description: Receive postback at this URL. Sends a JSON POST request with parameters `account_action` (added, updated, connected, disconnected), `account_id`, `account_type`, and `account_name`. The `account_action` is `disconnected` if an account is found disconnected by the system, `connected` if a previously disconnected account is reconnected by the system automatically, `added` when a new account is added/connected for the first time, and `updated` when an existing account is reconnected.
                                account_id:
                                    type: string
                                    description: Social account id if reconnecting an existing account.
            responses:
                '400':
                    description: The provider is not supported
                '200':
                    description: You get the URL for connecting social accounts. Recommended to open it in a popup.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    connect_url:
                                        type: string
                                        format: uri
                                        description: URL that you can visit to add your accounts
    '/accounts/{accountId}':
        get:
