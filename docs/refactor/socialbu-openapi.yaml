                - `react`: send a reaction value where the network supports message reactions.
                - `vote`: send a Reddit-style vote value where voting is supported.
                Actions such as `like`, `dislike`, `delete`, `hide`, `unhide`, `spam`, `repost`, and `unrepost` usually do not need a body.
