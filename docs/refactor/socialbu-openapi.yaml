openapi: 3.0.3
info:
    description: |
        This is documentation for the SocialBu API.

        Base URL: `https://socialbu.com/api/v1`

        Pass your API token from the SocialBu dashboard in the `Authorization` header:
        `Authorization: Bearer YOUR_API_TOKEN`

        You can get your API token from **Settings** in your SocialBu dashboard. You can also generate one programmatically by calling `POST /auth/get_token` with your email and password.

        Example GET request: `GET https://socialbu.com/api/v1/accounts`
    version: "1.0.0"
    title: SocialBu API
    termsOfService: 'https://socialbu.com/about/terms'
    contact:
        email: support@socialbu.com
servers:
    - description: SocialBu API
      url: https://socialbu.com/api/v1
tags:
    - name: Authentication
      description: Authenticate api requests
    - name: Posts
      description: Manage your posts
    - name: Tags
      description: Manage tags for posts or the inbox (post and inbox tags are independent).
    - name: Queues
      description: Manage your publishing queues and queue items.
    - name: Media Upload
      description: |
        Upload media files to your posts.

        **Option A — Three-step signed URL flow:**
          1. Get a signed URL for direct media upload to SocialBu's storage using `POST /upload_media`.
          2. Use the signed_url from Step 1 to upload your actual file (video/image) directly to SocialBu's storage.
          3. Once the file is uploaded, confirm its status using the media key returned in Step 1 via `/upload_media/status`.

        Now that the media is uploaded and verified, you can attach this file to your post using the upload_token recieved in Step 3.

        **Option B — Single-step URL or data URL upload:**
          Use `POST /upload_media_by_url` with an HTTP(S) URL or a base64 data URL. The server stores the file and returns an `upload_token` directly in one step — no signed URL or status check needed.
    - name: Accounts
      description: Manage your social accounts
    - name: Team
      description: Manage your teams
    - name: Curation
      description: Access curated content.
    - name: Insights
      description: Get valuable insights about your account's content.
    - name: Notifications
      description: Manage your notifications.
    - name: Social Inbox
      description: Access and manage social inbox conversations.
    - name: Social Listening
      description: Manage social listening sources, streams, and stream items.

security:
    - bearerAuth: []

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: |
                Send your SocialBu API token in the `Authorization` header:
                `Authorization: Bearer YOUR_API_TOKEN`
    schemas:
        BestPostingWeekday:
          type: object
          required: [weekday, name, total_posts, measured_posts, average_rate]
          properties:
            weekday:
              type: integer
              minimum: 1
              maximum: 7
              description: Monday is 1 and Sunday is 7 in the user's timezone.
            name:
              type: string
            total_posts:
              type: integer
            measured_posts:
              type: integer
            average_rate:
              type: number
              nullable: true
              description: Mean per-post engagement rate in percent; null when no post has a calculable rate.

        UploadedMediaTokenAttachment:
          type: object
          required:
            - upload_token
          properties:
            upload_token:
              type: string
              description: The value received from `/upload_media/status` or `/upload_media_by_url`.

        SavedPostAttachment:
          type: object
          description: |
            A previously saved attachment object as returned by `GET /posts/{postId}`.
            When updating a post, send this full object back to keep an already-saved attachment on the post.
          required:
            - path
          properties:
            path:
              type: string
              description: Storage path used to identify an already-saved attachment to keep during post updates.
            name:
              type: string
              description: Original or normalized filename for the attachment.
            type:
              type: string
              description: File extension for the attachment, such as `jpg`, `png`, or `mp4`.
            mime:
              type: string
              description: MIME type for the attachment.
            url:
              type: string
              format: uri
              description: Resolved media URL returned by the API.
            size:
              type: integer
              description: File size in bytes, when available.
            key:
              type: string
              description: Internal storage key. Included in some attachment payloads.
            secureKey:
              type: string
              description: Encrypted storage key. Included in some attachment payloads.
            extension:
              type: string
              description: File extension before normalization to `type`, when present.

        PostUpdateExistingAttachment:
          oneOf:
            - $ref: '#/components/schemas/UploadedMediaTokenAttachment'
            - $ref: '#/components/schemas/SavedPostAttachment'
          description: |
            `existing_attachments` on post updates accepts two input shapes:
            - Newly uploaded media token object: `{ "upload_token": "..." }`
            - Already-saved attachment object: the full attachment object returned by `GET /posts/{postId}`, including its `path`

            For already-saved attachments, sending only an `upload_token` is not enough to preserve them. The server matches saved attachments by `path`.
        
        GenericPostRequest:
          type: object
          required:
            - accounts
            - publish_at
          properties:
            accounts:
              type: array
              description: ID(s) of one or more social media accounts.
              items:
                type: integer
            team_id:
              type: integer
              description: Team Id of social media account.
            publish_at:
              type: string
              example: "2025-04-14 15:30:00"
              description: Format should be Y-m-d H:i:s (UTC)
            content:
              type: string
              description: The content for the post.
            draft:
                type: boolean
                description: Save the post as a draft
            queue_ids:
                type: array
                description: If provided, the post will be added to the specified queues.
                items:
                    type: integer
            existing_attachments:
              type: array
              description: Attachments already uploaded to SocialBu's storage using media upload endpoint.
              items:
                $ref: '#/components/schemas/UploadedMediaTokenAttachment'
            postback_url:
                type: string
                description: Receive postback at this URL if needed. Sends a JSON POST request with parameters `post_id`, `account_id`, and `status` (created, published, failed).
            tags:
              type: array
              maxItems: 10
              description: >-
                  ID(s) of existing tags to apply to the post (maximum 10). Use `GET /tags` to
                  list available tags and `POST /tags` to create new ones. Not supported together
                  with `queue_id`/`queue_ids` — a queued post has no tag scope until it's
                  actually published, so sending `tags` alongside either is rejected.
              items:
                type: integer


        Tag:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            color:
              type: string
              nullable: true
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: |
                Hex color. Any valid 6-digit hex color is accepted. Null/omitted for the default (uncolored) look.
            type:
              type: string
              enum: [post, inbox]
              nullable: true
              description: Whether this is a post tag or an inbox tag. Null on tags created before this distinction existed — those are treated as inbox tags.
            user_id:
              type: integer
              nullable: true
            team_id:
              type: integer
              nullable: true
              description: Set when the tag belongs to a team; omitted/null for personal tags.
            conversations_count:
              type: integer
              nullable: true
              description: Number of inbox conversations this tag is applied to. Only present for `type=inbox` tags; omitted for post tags, which can never be applied to a conversation.
            can_manage:
              type: boolean
              description: Whether the requesting user can rename or delete this tag. Always true for a personal tag; for a team tag it reflects the team permission required to manage that tag type (`posts.edit` for `type=post`, `inbox.manage` for `type=inbox`) — a member who can only list or create team tags gets `false`.

        Queue:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            user_id:
              type: integer
            user_name:
              type: string
            options:
              type: object
              additionalProperties: true
              nullable: true
            team_id:
              type: integer
              nullable: true
            active:
              type: boolean
            times_to_publish:
              type: integer
              nullable: true
            next_publish_at:
              type: string
              nullable: true
            started_at:
              type: string
              nullable: true
            ended_at:
              type: string
              nullable: true
            created_at:
              type: string
              nullable: true
            updated_at:
              type: string
              nullable: true
            need_cleanup:
              type: boolean

        QueueListResponse:
          type: array
          items:
            $ref: '#/components/schemas/Queue'

        QueuePostCreateRequest:
          type: object
          required:
            - accounts
          properties:
            accounts:
              type: array
              description: ID(s) of one or more social media accounts used to validate queue post options.
              items:
                type: integer
            content:
              type: string
              description: The content to save into the queue.
            options:
              type: object
              description: Queue post options. Can be a shared options object or keyed by account ID.
              additionalProperties: true
            existing_attachments:
              type: array
              description: Attachments already uploaded to SocialBu's storage using media upload endpoint.
              items:
                $ref: '#/components/schemas/UploadedMediaTokenAttachment'

        QueueItem:
          type: object
          additionalProperties: true
          description: A queue item object as returned by the queue posts endpoint.

        QueuePostsResponse:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
            currentPage:
              type: integer
            lastPage:
              type: integer
            nextPage:
              type: integer
              nullable: true
            total:
              type: integer
            nextItemId:
              type: integer
              nullable: true
            nextPublishTime:
              type: string
              nullable: true

        ThreadedReplies:
            type: array
            description: Threaded replies (thread posts). Each reply can have text and/or media.
            items:
                type: object
                description: A single threaded reply (text and/or media).
                properties:
                    text:
                        type: string
                        description: The text content of the threaded reply.
                    existing_attachments:
                        type: array
                        description: Attachments already uploaded to SocialBu's storage using media upload endpoint.
                        items:
                            $ref: '#/components/schemas/UploadedMediaTokenAttachment'

        FacebookPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                    options:
                        type: object
                        description: Additional options for the post.
                        properties:
                            comment:
                                type: string
                                description: First comment for the post
                            post_as_story:
                                type: boolean
                                description: Set true to post the content as a story. Supported for posts having media attachment(s)
                            post_as_reel:
                                type: boolean
                                description: Set true to post the content as a reel. Supported for video posts only
                            video_title:
                                type: string
                                description: Title for video attachment
                            media_alt_text:
                                type: array
                                description: Alternate text descriptions for each media item in the post.
                                items:
                                    type: string
                            thumbnail:
                                type: object
                                description: Add thumbnail (video post only)
                                properties:
                                    name:
                                        type: string
                                        description: File name (e.g., "image.png").
                                    mimeType:
                                        type: string
                                        description: MIME type of the media (e.g., "image/png").
                                    extension:
                                        type: string
                                        description: File extension (e.g., png, mp4).
                                    key:
                                        type: string
                                        description: Media key, received when uploading media using media upload endpoint.
                                    url:
                                        type: string
                                        description: Media URL, received when uploading media using media upload endpoint.
                                    secureKey:
                                        type: string
                                        description: Media secure key, received when uploading media using media upload endpoint.
                                    temporary:
                                        type: boolean
                                        description: Media status, received when uploading media using media upload endpoint.
                                    _metaData:
                                        type: object
                                        description: Information about media.
                                        properties:
                                            width:
                                                type: integer
                                                description: Width of the media.
                                            height:
                                                type: integer
                                                description: Height of the media.


        InstagramPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                    options:
                        type: object
                        description: Additional options for the post.
                        properties:
                            post_as_story:
                                type: boolean
                                description: Set true to post the content as a story. Supported for posts having a media attachment
                            share_reel_to_feed:
                                type: boolean
                                description: Set true to share the reel to feed. Supported when posting a reel (video)
                            post_as_trial_reel:
                                type: boolean
                                description: Set true to post the video as a Trial Reel. Trial Reels are shown to non-followers first and require a single-video post with at least 100 followers. Cannot be combined with `share_reel_to_feed`.
                            trial_reel_graduation_strategy:
                                type: boolean
                                description: Set true to automatically share the Trial Reel to your followers when it performs well (`SS_PERFORMANCE`). Set false (or omit) to keep it in trial mode until manually shared (`MANUAL`). Only applicable when `post_as_trial_reel` is true.
                            comment:
                                type: string
                                description: First comment for the post
                            media_alt_text:
                                type: array
                                description: Alternate text descriptions for each media item in the post.
                                items:
                                    type: string
                            thumbnail:
                                type: object
                                description: Add thumbnail (video post only)
                                properties:
                                    name:
                                        type: string
                                        description: File name (e.g., "image.png").
                                    mimeType:
                                        type: string
                                        description: MIME type of the media (e.g., "image/png").
                                    extension:
                                        type: string
                                        description: File extension (e.g., png, mp4).
                                    key:
                                        type: string
                                        description: Media key, received when uploading media using media upload endpoint.
                                    url:
                                        type: string
                                        description: Media URL, received when uploading media using media upload endpoint.
                                    secureKey:
                                        type: string
                                        description: Media secure key, received when uploading media using media upload endpoint.
                                    temporary:
                                        type: boolean
                                        description: Media status, received when uploading media using media upload endpoint.
                                    _metaData:
                                        type: object
                                        description: Information about media.
                                        properties:
                                            width:
                                                type: integer
                                                description: Width of the media.
                                            height:
                                                type: integer
                                                description: Height of the media.

        ThreadsPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          properties:
                              reply_control:
                                  type: string
                                  description: Who can reply to the post.
                                  enum:
                                    - everyone
                                    - accounts_you_follow
                                    - mentioned_only
                              threaded_replies:
                                  $ref: '#/components/schemas/ThreadedReplies'


        XPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          properties:
                              media_alt_text:
                                  type: array
                                  description: Alternate text descriptions for each media item in the post.
                                  items:
                                      type: string

                              threaded_replies:
                                  $ref: '#/components/schemas/ThreadedReplies'

                              made_with_ai:
                                  type: boolean
                                  description: Set to true to disclose that the tweet contains AI-generated media. Only applies to the post (and any threaded replies) that have an attached image or video.


        LinkedinPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          required:
                            - document_title
                          description: Additional options for the post.
                          properties:
                              link:
                                  type: string
                                  description: Link for the post.
                              trim_link_from_content:
                                  type: boolean
                                  description: Trim the link from the content.
                              customize_link:
                                  type: boolean
                                  description: Set to true, if you want to custimze the link.
                              link_description:
                                  type: string
                                  description: Set custom link description when customize_link is set to true.
                              link_title:
                                  type: string
                                  description: Set custom link title when customize_link is set to true.
                              media_alt_text:
                                type: array
                                description: Alternate text descriptions for each media item in the post.
                                items:
                                    type: string
                              video_thumbnail:
                                  type: object
                                  description: Optional custom JPEG or PNG thumbnail for a post with exactly one supported video attachment, separate from the link thumbnail. Uses the media object returned by the media upload endpoint. If the thumbnail cannot be read or uploaded at publish time, the video is published without it.
                                  properties:
                                    upload_token:
                                        type: string
                                        description: Upload token returned by `/upload_media/status` or `/upload_media_by_url` for a newly uploaded thumbnail.
                                    key:
                                        type: string
                                        description: Storage key returned for an already-saved thumbnail.
                                    temporary:
                                        type: boolean
                                        description: Whether the uploaded media is temporary.
                              thumbnail:
                                  type: object
                                  description: Custom link thumbnail.
                                  properties:
                                    name:
                                        type: string
                                        description: File name (e.g., "image.png").
                                    mimeType:
                                        type: string
                                        description: MIME type of the media (e.g., "image/png").
                                    extension:
                                        type: string
                                        description: File extension (e.g., png, mp4).
                                    key:
                                        type: string
                                        description: Media key, received when uploading media using media upload endpoint.
                                    url:
                                        type: string
                                        description: Media URL, received when uploading media using media upload endpoint.
                                    secureKey:
                                        type: string
                                        description: Media secure key, received when uploading media using media upload endpoint.
                                    temporary:
                                        type: boolean
                                        description: Media status, received when uploading media using media upload endpoint.
                                    _metaData:
                                        type: object
                                        description: Information about media.
                                        properties:
                                            width:
                                                type: integer
                                                description: Width of the media.
                                            height:
                                                type: integer
                                                description: Height of the media.
                              comment:
                                  type: string
                                  description: First comment for the post.
                              document_title:
                                  type: string
                                  description: Custom document title. Required for posts having PDF, PPT, or Doc as an attachment.



        RedditPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          required:
                            - 'title'
                          properties:
                              title:
                                  type: string
                                  description: Title of the post
                              is_spoiler:
                                  type: boolean
                                  description: Mark the post as spoiler
                              is_nsfw:
                                  type: boolean
                                  description: Mark the post as NSFW
                              flair_id:
                                  type: integer
                                  description: Flair ID can be obtained from accounts' extra_data
                              comment:
                                  type: string
                                  description: First comment for your post.



        MastodonPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          properties:
                              mark_sensitive:
                                  type: boolean
                                  description: Mark status and attached media as sensitive
                              spoiler:
                                  type: string
                                  description: Text to be shown as a warning or subject before the actual content
                              media_alt_text:
                                  type: array
                                  description: Alternate text descriptions for each media item in the post.
                                  items:
                                    type: string
                              threaded_replies:
                                  $ref: '#/components/schemas/ThreadedReplies'


        PinterestPostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          required:
                            - 'thumbnail'
                            - 'board_name'
                          properties:
                              thumbnail:
                                  type: object
                                  description: Supported for posts having video attachment.
                                  properties:
                                      name:
                                          type: string
                                          description: File name (e.g., "image.png").
                                      mimeType:
                                          type: string
                                          description: MIME type of the media (e.g., "image/png").
                                      extension:
                                          type: string
                                          description: File type (e.g., "png")
                                      key:
                                          type: string
                                          description: Media key, received when uploading media using media upload endpoint.
                                      url:
                                          type: string
                                          description: Media URL, received when uploading media using media upload endpoint.
                                      secureKey:
                                          type: string
                                          description: Media secure, key received when uploading media using media upload endpoint.
                                      temporary:
                                          type: boolean
                                          description: Media status, received when uploading media using media upload endpoint.
                                      _metaData:
                                          type: object
                                          description: Information about media.
                                          properties:
                                              width:
                                                  type: integer
                                                  description: Width of the media.
                                              height:
                                                  type: integer
                                                  description: Height of the media.
                              pin_title:
                                  type: string
                                  description: Title of the pin to be displayed on the board.
                              board_name:
                                  type: string
                                  description: Name of the board where the pin will be saved.
                              media_alt_text:
                                  type: array
                                  description: Alternate text descriptions for each media item in the post.
                                  items:
                                      type: string
                              pin_link:
                                  type: string
                                  description: Target URL associated with the pin.



        GoogleBusinessProfilePostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          properties:
                              topic_type:
                                  type: string
                                  description: Set the post type `EVENT` or  `OFFER`. By default the post type is standard.
                              event_title:
                                  type: boolean
                                  description: Set the event title. Required when topic_type is EVENT or OFFER
                              event_start:
                                  type: string
                                  format: date-time
                                  description: Format should be Y-m-d H:i:s, Required when topic_type is EVENT or OFFER
                              event_end:
                                  type: string
                                  format: date-time
                                  description: Format should be Y-m-d H:i:s, Required when topic_type is EVENT or OFFER
                              offer_coupon:
                                  type: string
                                  description: Coupon code for offer
                              offer_link:
                                  type: string
                                  description: Link where the offer can be redeemed
                              offer_terms:
                                  type: string
                                  description: Rules or conditions for redeeming the offer.
                              call_to_action:
                                  type: string
                                  description: a message that encourages users to take a specific action, could be `BOOK`, `ORDER`, `SHOP`, `LEARN_MORE`, `SIGN_UP`, or `CALL`
                              call_to_action_url:
                                  type: string
                                  description: Link to where you want the call-to-action button to take the user.
                              save_media_to_gallery:
                                  type: boolean
                                  description: Save the media in the gallery.



        YoutubePostRequest:
            allOf:
                - $ref: '#/components/schemas/GenericPostRequest'
                - type: object
                  properties:
                      options:
                          type: object
                          description: Additional options for the post.
                          properties:
                              video_title:
                                  type: string
                                  description: Title of video.
                              video_tags:
                                  type: string
                                  description: Add tags, separated by comma.
                              category_id:
                                  type: integer
                                  description: You can get the categories list from account's extra_data.
                              privacy_status:
                                  type: string
                                  description: Set the video privacy (public, private, or unlisted).
                              post_as_short:
                                  type: boolean
                                  description: Set true to post the video as youtube shorts.
                              made_for_kids:
                                  type: boolean
                                  description: Set true to post the video as made for kids.
                              thumbnail:
                                  type: object
                                  description: Supported for posts having video attachment.
                                  properties:
                                      name:
                                          type: string
                                          description: File name (e.g., "image.png").
                                      mimeType:
                                          type: string
                                          description: MIME type of the media (e.g., "image/png").
                                      extension:
                                          type: string
                                          description: File type (e.g., "png")
                                      key:
                                          type: string
                                          description: Media key, received when uploading media using media upload endpoint.
                                      url:
                                          type: string
                                          description: Media URL, received when uploading media using media upload endpoint.
                                      secureKey:
                                          type: string
                                          description: Media secure, key received when uploading media using media upload endpoint.
                                      temporary:
                                          type: boolean
                                          description: Media status, received when uploading media using media upload endpoint.
                                      _metaData:
                                          type: object
                                          description: Information about media.
                                          properties:
                                              width:
                                                  type: integer
                                                  description: Width of the media.
                                              height:
                                                  type: integer
                                                  description: Height of the media.



        TiktokPostRequest:
            allOf:
            - $ref: '#/components/schemas/GenericPostRequest'
            - type: object
              properties:
                options:
                    type: object
                    required:
                     - 'privacy_status'
                    properties:
                        title:
                            type: string
                            description: Title of Tiktok post.
                        privacy_status:
                            type: string
                            description: Set the post privacy to one of extra_data.creator_info.privacy_level_options (found in the Account object). For example, `PUBLIC_TO_EVERYONE`.
                        allow_stitch:
                            type: boolean
                            description: Set true to allow others to Stitch your video.
                        allow_duet:
                            type: boolean
                            description: Set true to allow others to create Duet videos with your post.
                        allow_comment:
                            type: boolean
                            description: Set true to allow comments on your post.
                        disclose_content:
                              type: boolean
                              description: Set true to indicate whether this content promotes yourself, a brand, product or service
                        branded_content:
                              type: boolean
