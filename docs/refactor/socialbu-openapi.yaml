                                                            required:
                                                                - date
                                                                - value
                                                latest:
                                                    type: array
                                                    description: Latest snapshot values per metric for this account.
                                                    items:
                                                        type: object
                                                        properties:
                                                            type:
                                                                type: string
                                                                description: Metric type.
                                                            value:
                                                                type: integer
                                                                description: Latest metric value.
                                                            timestamp:
                                                                type: string
                                                                format: date-time
                                                                description: Timestamp for the latest value.
                                                        required:
                                                            - type
                                                            - value
                                                            - timestamp
                                            required:
                                                - account_id
                                                - metrics
                                                - latest
            parameters:
                - name: start
                  in: query
                  description: The start date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d
                - name: end
                  in: query
                  description: The end date
                  required: true
                  schema:
                      type: string
                      format: date
                      description: Format should be Y-m-d
                - name: metrics
                  in: query
                  description: |
                        Metric types to fetch. Accepts either a comma-separated string
                        or repeated query parameters such as `metrics[]=followers&metrics[]=followers_by_country/*`.

                        **Wildcard patterns** — some metrics are keyed as `{prefix}/{value}` where the suffix
                        represents a dimension (country code, age/gender bracket, industry, etc.). You can
                        request all values for a dimension using `*` as the suffix, or request a single value
                        by providing the exact key:

                        | Pattern | What `*` represents | Example exact key |
                        |---|---|---|
                        | `followers_by_country/*` | ISO 3166-1 alpha-2 country code | `followers_by_country/US` |
                        | `followers_by_gender_age/*` | Age bracket + gender code — `M`, `F`, or `U` (Instagram) | `followers_by_gender_age/25-34_M` |
                        | `fans_by_country/*` | ISO 3166-1 alpha-2 country code (Facebook) | `fans_by_country/GB` |
                        | `fan_adds_by_paid_non_paid_unique/*` | `paid` or `unpaid` (Facebook) | `fan_adds_by_paid_non_paid_unique/paid` |
                        | `followers_by_industry/*` | LinkedIn industry URN | `followers_by_industry/urn:li:industry:4` |
                        | `followers_by_function/*` | LinkedIn job function URN | `followers_by_function/urn:li:function:8` |
                        | `followers_by_seniority/*` | LinkedIn seniority URN | `followers_by_seniority/urn:li:seniority:4` |
                        | `followers_by_staff_count_range/*` | LinkedIn company size bucket | `followers_by_staff_count_range/SIZE_11_TO_50` |
                        | `views_by_country/*` | ISO 3166-1 alpha-2 country code (LinkedIn) | `views_by_country/DE` |

                        Supported account metrics for each network:

                        - **Facebook Page**:
                            - *Daily:* `total_actions`, `post_engagements`, `impressions`, `fans`, `fan_adds_by_paid_non_paid_unique/*`, `fans_by_country/*`, `video_views`, `video_views_paid`, `video_views_organic`, `video_complete_views_30s`, `video_view_time`, `views_total`
                            - *Lifetime:* `post_clicks`, `post_video_avg_time_watched`
                        - **Instagram**: `followers`, `reach`, `profile_views`, `accounts_engaged`, `total_interactions`, `likes`, `comments`, `shares`, `saves`, `replies`, `views`, `followers_by_country/*`, `followers_by_gender_age/*`
                        - **Twitter / X**: `followers`, `verified_followers`
                        - **LinkedIn Org & Brand**: `followers`, `followers_by_staff_count_range/*`, `followers_by_industry/*`, `followers_by_function/*`, `followers_by_seniority/*`, `views_by_country/*`, `total_views`
                        - **LinkedIn Profile**: *(no account metrics)*
                        - **YouTube**: `views`, `subscribers`, `videos`
                        - **Google Business Location**: `desktop_map_views`, `mobile_map_views`, `actions_website`, `actions_phone`, `actions_driving_directions`, `reviews`
                        - **TikTok**: `followers`, `following`, `likes`, `videos`
                        - **Threads**: `views`, `likes`, `replies`, `reposts`, `quotes`, `followers_count`
                        - **Bluesky**: `followers`
                        - **Mastodon**: `followers`
                        - **Pinterest**: `followers`, `monthly_views`, and dynamic summary analytics keys (e.g. `impression`, `engagements`, `pin_click`, `save`)
                        - **Reddit Profile**: `karma`
                        - **Reddit Subreddit**: *(account metrics not supported)*

                  required: true
                  schema:
                      oneOf:
                          - type: string
                          - type: array
                            items:
                                type: string
                  examples:
                      instagramAudience:
                          summary: Instagram audience dimensions
                          value: followers,followers_by_country/*,followers_by_gender_age/*
                      linkedinCompanyViews:
                          summary: LinkedIn company page views
                          value: followers,total_views,views_by_country/*
                      googleBusinessActions:
                          summary: Google Business Profile actions
                          value: desktop_map_views,mobile_map_views,actions_website,actions_phone,reviews
                - name: calculate_growth
                  in: query
                  description: |
                        Whether to return day-over-day deltas from cumulative metric values.
                        Defaults to true.
                  schema:
                      type: boolean
                      default: true
                - name: accounts
                  in: query
                  description: An array of account IDs.
                  schema:
                      type: array
                      items:
                          type: integer
                - name: team
                  in: query
                  description: The team id
                  schema:
                      type: integer

