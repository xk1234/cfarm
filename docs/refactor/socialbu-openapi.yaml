paths:
    /:
        get:
            security: []
            tags:
                - Authentication
            summary: Discover the SocialBu API
            description: Returns links to the API documentation, OpenAPI specification, authentication endpoint, and MCP server.
            operationId: discoverApi
            responses:
                '200':
                    description: API discovery information
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - name
                                    - version
                                    - documentation
                                    - openapi
                                    - authentication
                                    - mcp
                                properties:
                                    name:
                                        type: string
                                    version:
                                        type: string
                                    documentation:
                                        type: string
                                        format: uri
                                    openapi:
                                        type: string
                                        format: uri
                                    authentication:
                                        type: object
                                        properties:
                                            type:
                                                type: string
                                            token_endpoint:
                                                type: string
                                                format: uri
                                    mcp:
                                        type: string
                                        format: uri
                '429':
                    description: Too many requests

    /auth/get_token:
        post:
            security:
                - {}
            tags:
                - Authentication
            summary: Get access token for authentication of requests
            description: |
                Generates an access token for API authentication.
            operationId: getToken
            responses:
                '200':
                    description: Access token
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    authToken:
                                        type: string
                                        description: New access token. Any old token will be invalidated.
                                    id:
                                        type: integer
                                        description: User's Socialbu Account ID.
                                    name:
                                        type: string
                                        description: User's Socialbu Account Name.
                                    email:
                                        type: string
                                        description: User's Socialbu Account Email.
                                    verified:
                                        type: boolean
                                        description: User's email verification status.
                '400':
                    description: Bad Request
                '422':
                    description: The given data was incorrect.

            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                                - password
                            properties:
                                email:
                                    type: string
                                    description: User's email address e.g, (user@example.com)
                                password:
                                    type: string
                                    description: User's password.

    /auth/logout:
        post:
            tags:
                - Authentication
            summary: Destroy current access token
            description: Logs you out by destroying your access token.
            operationId: logout
            responses:
                '200':
                    description: Logged out successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        description: Indicates whether logout was successful.
                '400':
                    description: Bad Request

    /posts:
        get:
            tags:
                - Posts
            summary: List posts
            description: Returns a paginated list of posts filtered by their status. Use the `type` parameter to fetch scheduled, draft, awaiting-approval, or published posts. Reviewed post objects include `reviewed_by` with `id`, `name`, and `action` (`approved` or `rejected`) when approval metadata is available.
            operationId: getPosts
            responses:
                '200':
                    description: Get Posts
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    items:
                                        type: array
                                        description: An array of post objects.
                                        items:
                                            type: object
                                            additionalProperties: true
                                    currentPage:
                                        type: integer
                                        description: The current page number of the paginated results.
                                    lastPage:
                                        type: integer
                                        description: The last page number of the paginated results.
                                    nextPage:
                                        type: integer
                                        nullable: true
                                        description: The next page number, or null if this is the last page.
                                    total:
                                        type: integer
                                        description: Total number of items.
                '400':
                    description: Bad Request
                '422':
                    description: The given data was invalid.
            parameters:
                - name: type
                  in: query
                  description: The type of posts you want to fetch
                  schema:
                      type: string
                      enum:
                          - scheduled
                          - awaiting_approval
                          - scheduled_or_awaiting_approval
                          - draft
                          - published
                      default: scheduled_or_awaiting_approval
                - name: perPage
                  in: query
                  description: Number of posts per page. Maximum 100.
                  schema:
                      type: integer
                      maximum: 100
                - name: page
                  in: query
                  description: Page number to fetch.
                  schema:
                      type: integer
                - name: start
                  in: query
                  description: Filter posts on or after this date.
                  schema:
                      type: string
                      format: date
                - name: end
                  in: query
                  description: Filter posts on or before this date.
                  schema:
                      type: string
                      format: date
                - name: team
                  in: query
                  description: Limit results to a specific team ID.
                  schema:
                      type: integer
                - name: accounts
                  in: query
                  description: Limit results to specific account IDs.
                  schema:
                      type: array
                      items:
                          type: integer
                - name: user
                  in: query
                  description: Limit results to posts created by a specific user ID.
                  schema:
                      type: integer
                - name: tags
                  in: query
                  description: >-
                      Limit results to posts having any of these tag IDs. Send either a
                      comma-separated list (`tags=1,2`) or the repeated `tags[]=1&tags[]=2` form.
                  style: form
                  explode: false
                  schema:
                      type: array
                      items:
                          type: integer
                - name: source
                  in: query
                  description: Filter by post source.
                  schema:
                      type: string
                - name: q
                  in: query
                  description: Free-text search query.
                  schema:
                      type: string
                - name: include_post
                  in: query
                  description: Include a specific post ID in the result set when relevant to the UI flow.
                  schema:
                      type: integer
        post:
            tags:
                - Posts
            summary: Create a new post.
            description: |
                Creates a new post for one or more social media accounts. Each network has its own optional `options` object — refer to the network-specific request schemas below.

                To attach media, first upload it via `/upload_media` or `/upload_media_by_url` and include the returned `upload_token` in `existing_attachments`.

                This endpoint also supports a queue shortcut:
                - Send `queue_id` or `queue_ids` to save the post into one or more queues instead of creating scheduled posts.
                - In queue mode, the response only contains a confirmation message.
            operationId: createPost
            responses:
                '200':
                    description: Post created or saved to queue.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - type: object
                                      properties:
                                          success:
                                              type: boolean
                                              description: Indicates whether the post was created successfully.
                                          posts:
                                              type: array
                                              description: An array of created post objects.
                                              items:
                                                  type: object
                                                  additionalProperties: true
                                    - type: object
                                      properties:
                                          message:
                                              type: string
                                              example: Successfully saved to queue

                '400':
                    description: Bad Request
                '422':
                    description: The given data was invalid.
            requestBody:
                content:
                    application/json:
                        schema:
                            anyOf:
                                - $ref: '#/components/schemas/FacebookPostRequest'
                                - $ref: '#/components/schemas/InstagramPostRequest'
                                - $ref: '#/components/schemas/XPostRequest'
                                - $ref: '#/components/schemas/ThreadsPostRequest'
                                - $ref: '#/components/schemas/LinkedinPostRequest'
                                - $ref: '#/components/schemas/RedditPostRequest'
                                - $ref: '#/components/schemas/MastodonPostRequest'
                                - $ref: '#/components/schemas/PinterestPostRequest'
                                - $ref: '#/components/schemas/GoogleBusinessProfilePostRequest'
                                - $ref: '#/components/schemas/YoutubePostRequest'
                                - $ref: '#/components/schemas/TiktokPostRequest'
                                - $ref: '#/components/schemas/BlueskyPostRequest'

    /posts/supported-options:
        get:
            tags:
                - Posts
            summary: Get supported post options for accounts
            description: Returns the raw publish handler option definitions for the specified accounts or all available accounts. Each option includes its type, label, constraints, and available choices.
            operationId: getSupportedOptions
            parameters:
                - name: account_ids
                  in: query
                  description: Comma-separated list of account IDs to get options for. If omitted, returns options for all available accounts.
                  required: false
                  schema:
                      type: string
                      example: '1,2,3'
            responses:
                '200':
                    description: Supported options retrieved successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    accounts:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                account_id:
                                                    type: integer
                                                    description: The account ID.
                                                account_type:
                                                    type: string
                                                    description: The social network type (e.g. instagram, facebook, twitter).
                                                account_name:
                                                    type: string
                                                    description: The account display name.
                                                options:
                                                    type: object
                                                    description: A map of option keys to their raw definitions from the publish handler.
                                                    additionalProperties:
                                                        type: object
                                                        properties:
                                                            label:
                                                                type: string
                                                            type:
                                                                type: string
                                                                description: Raw option type from publish handler.
                                                                enum:
                                                                    - string
                                                                    - boolean
                                                                    - dropdown
                                                                    - json
                                                            storage:
                                                                type: string
                                                                description: Storage type for the option value.
                                                                enum:
                                                                    - scalar
                                                                    - json
                                                                    - file
                                                            required:
                                                                type: boolean
                                                            default:
                                                                description: The default value for this option.
                                                            max_length:
                                                                type: integer
                                                            options:
                                                                type: array
                                                                items:
                                                                    type: object
                                                                    properties:
                                                                        value:
                                                                            type: string
                                                                        label:
                                                                            type: string
                                                                description: Available choices for dropdown-type options.
                '404':
                    description: No matching accounts found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: false
                                    message:
                                        type: string
                                        example: No matching accounts found.

    /tags:
        get:
            tags:
                - Tags
            summary: List tags
            description: Returns tags available to the authenticated user. Pass `team_id` to list a team's tags — requires any of `posts.view`, `posts.create` or `posts.edit` for `type=post`, or `inbox.manage` for `type=inbox`. Omit `team_id` to list your personal tags.
            operationId: listTags
            parameters:
                - name: type
                  in: query
                  required: true
                  description: Which set of tags to list — post tags or inbox tags. Tags are no longer shared between the two.
                  schema:
                      type: string
                      enum: [post, inbox]
                - name: team_id
                  in: query
                  description: Team ID to scope the tag list to. Omit to list personal tags.
                  schema:
                      type: integer
            responses:
                '200':
                    description: Tag list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Tag'
                '403':
                    description: You do not have permission to access this team's tags.
        post:
            tags:
                - Tags
            summary: Create a tag
            description: Creates a new tag, either personal or scoped to a team. A team `type=post` tag requires `posts.create` or `posts.edit`; a team `type=inbox` tag requires `inbox.manage`.
            operationId: createTag
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                                - type
                            properties:
                                name:
                                    type: string
                                    minLength: 2
                                    maxLength: 50
                                team_id:
                                    type: integer
                                    description: Team ID to create the tag under. Omit to create a personal tag.
                                color:
                                    type: string
                                    nullable: true
                                    pattern: '^#[0-9A-Fa-f]{6}$'
                                    description: Hex color. Any valid 6-digit hex color is accepted. Omit for the default (uncolored) look.
                                type:
                                    type: string
                                    enum: [post, inbox]
                                    description: Whether this is a post tag or an inbox tag. Tags are no longer shared between the two.
            responses:
                '200':
                    description: Tag created successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    tag:
                                        type: string
                                        description: The created tag's name.
                                    id:
                                        type: integer
                                        description: The created tag's id.
                                    color:
                                        type: string
                                        nullable: true
                                    can_manage:
                                        type: boolean
                                        description: Whether the requesting user can also rename/delete this tag — see the Tag schema. A create-only team member gets `false` even for a tag they just created.
                '400':
                    description: Tag already exists.
                '403':
                    description: You do not have permission to create a tag for this team.
                '422':
                    description: Validation failed (e.g. missing/invalid `type`, or `color` not a valid `#RRGGBB` hex string).

    '/tags/{id}':
        patch:
            tags:
                - Tags
            summary: Rename a tag
            description: Renames or recolors a tag. For a team tag this requires `posts.edit` (`type=post`) or `inbox.manage` (`type=inbox`).
            operationId: updateTag
            parameters:
                - name: id
                  in: path
                  description: Tag ID.
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                            properties:
                                name:
                                    type: string
                                    minLength: 2
                                    maxLength: 50
                                color:
                                    type: string
                                    nullable: true
                                    pattern: '^#[0-9A-Fa-f]{6}$'
                                    description: Hex color. Any valid 6-digit hex color is accepted. Omit to leave the current color unchanged.
            responses:
                '200':
                    description: Tag updated successfully.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                    tag:
                                        $ref: '#/components/schemas/Tag'
                '400':
                    description: Tag already exists.
                '404':
                    description: Tag not found.
        delete:
            tags:
                - Tags
            summary: Delete a tag
            description: Deletes the tag and removes it from any posts or inbox conversations it was applied to. For a team tag this requires `posts.edit` (`type=post`) or `inbox.manage` (`type=inbox`).
            operationId: deleteTag
            parameters:
                - name: id
                  in: path
                  description: Tag ID.
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Tag deleted successfully.
                '404':
                    description: Tag not found.

    /queues:
        get:
            tags:
                - Queues
            summary: List available queues
            description: Returns all queues available to the authenticated user, including team queues they can access.
            operationId: listQueues
            responses:
                '200':
