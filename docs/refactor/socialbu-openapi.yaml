                                    type: string
                                    description: MIME type of the media (e.g., "image/png").
                                extension:
                                    type: string
                                    description: File type (e.g., "png")
                                key:
                                    type: string
                                    description: Media key, received when uploading media using media upload endpoint.
                                url:
