                                                            description: Unique identifier of the social media account.
                                                        followers:
                                                            type: integer
                                                            description: Number of followers for this account.
                                                        last_fetched_at:
                                                            type: string
                                                            format: date-time
                                                            nullable: true
                                                            description: When this account's follower count was last fetched, or null if never fetched.
                                            last_fetched_at:
                                                type: string
                                                format: date-time
                                                nullable: true
                                                description: The most recent last_fetched_at across all accounts, or null if none have been fetched.

    /insights/accounts/followers/growth:
        get:
            tags:
                - Insights
            summary: Get followers growth over time.
            description: |
                Returns daily net followers growth (day-over-day change) for all accessible accounts within the specified date range.

                Covers the same networks as `/insights/accounts/followers`: **Instagram**, **Twitter/X**, **TikTok**, **Bluesky**, **Mastodon**, **Pinterest**, **LinkedIn Org**, **LinkedIn Brand**, **Facebook Page**, **YouTube**, **Threads**.
            operationId: getFollowersGrowth
            responses:
                '404':
                    description: Resource not found
                '422':
                    description: Validation error
                '200':
                    description: successful operation
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        description: An array of daily followers growth data.
                                        items:
                                            type: object
                                            properties:
                                                date:
                                                    type: string
                                                    format: date
                                                    description: The specific date for which net growth is reported.
                                                total_followers:
                                                    type: integer
                                                    description: Net followers growth across all accessible accounts for this date.
                                    last_fetched_at:
                                        type: string
                                        format: date-time
                                        nullable: true
                                        description: When the underlying follower metrics were last fetched, or null if none have been fetched.
            parameters:
