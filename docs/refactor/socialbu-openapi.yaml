                  schema:
                      type: string
                      minLength: 3
                - name: platform
                  in: query
                  required: false
                  description: Filter items by source platform.
                  schema:
                      type: string
                      enum:
                          - bluesky
                          - hackernews
                          - reddit
                          - threads
                          - tiktok
                          - twitter
                          - youtube
                - name: status
                  in: query
                  required: false
