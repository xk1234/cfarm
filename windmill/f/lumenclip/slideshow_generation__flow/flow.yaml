              ?? results.select_expand_hook?.output ??
              results.resolve_slide_count?.output ??
              results.validate_input?.output ?? flow_input.input
        path: f/lumenclip/run_pipeline_stage
      skip_if:
        expr: flow_input.start_at &&
          ["slideshow-generation.validate-input","slideshow-generation.resolve-slide-count","slideshow-generation.select-expand-hook","slideshow-generation.research-hook","slideshow-generation.build-text-prompt","slideshow-generation.generate-slide-text","slideshow-generation.retry-text-similarity","slideshow-generation.derive-visual-concepts","slideshow-generation.build-image-shortlists","slideshow-generation.select-slide-images","slideshow-generation.assemble-plan","slideshow-generation.translate-plan","slideshow-generation.render-store-pngs","slideshow-generation.render-store-mp4","slideshow-generation.validate-output","slideshow-generation.finalize-output"].indexOf(flow_input.start_at)
          > 15
      stop_after_if:
        expr: result.status === "running" || flow_input.stop_after ===
          "slideshow-generation.finalize-output"
        skip_if_stopped: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
