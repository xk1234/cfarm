summary: "lumenclip - slideshow generation"
description: "Generate a complete slideshow through individually observable and composable stages."
value:
  modules:
    - id: load_validation_inputs
      summary: "Load inputs consumed together by slideshow validation"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Template schema"
            modules:
              - id: load_template
                summary: "Load template schema"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.load-automation-record"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ automationId: flow_input.automation_id })"
          - summary: "Image collections and assets"
            modules:
              - id: load_collections
                summary: "Load image collections"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.list-image-collections"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({})"
          - summary: "Word variables and hooks"
            modules:
              - id: load_word_collections
                summary: "Load word collections"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.list-word-collections"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({})"

    - id: validate_input
      summary: "Validate template, collections, and word variables"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.validate-input"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ automationId: flow_input.automation_id, automationRecord: results.load_validation_inputs[0].output.automationRecord, collections: results.load_validation_inputs[1].output.collections, wordCollections: results.load_validation_inputs[2].output.wordCollections, hook: flow_input.hook, contentControls: flow_input.content_controls, collectionOverrides: flow_input.collection_overrides, slideOverrides: flow_input.slide_overrides })"
    - id: produce_text_and_candidates
      summary: "Generate text while static image pools are prepared"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Text generation"
            modules:
              - id: load_model_settings
                summary: "Load text generation model"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.load-model-settings"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.validate_input.output"
              - id: apply_fixed_slide_count
                summary: "Apply fixed slide count"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.apply-fixed-slide-count"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ ...results.load_model_settings.output, textModel: results.load_model_settings.output.generationSettings.slideshowTextModel })"
              - id: select_expand_hook
                summary: "Select and expand hook"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.select-expand-hook"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.apply_fixed_slide_count.output"
              - id: build_text_prompt
                summary: "Build structured text prompt"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.build-text-prompt"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.select_expand_hook.output"
              - id: generate_slide_text
                summary: "Generate slide text"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.generate-slide-text"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.build_text_prompt.output"
          - summary: "Static image candidate preparation"
            modules:
              - id: prepare_image_candidate_pools
                summary: "Prepare static image candidate pools"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "slideshow-generation.prepare-image-candidate-pools"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ textAutomation: results.validate_input.output.textAutomation, collections: results.validate_input.output.collections })"
    - id: build_image_shortlists
      summary: "Visual path — build image shortlists"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.build-image-shortlists"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ ...results.produce_text_and_candidates[0].output, candidatesBySlide: results.produce_text_and_candidates[1].output.candidatesBySlide })"
    - id: select_slide_images
      summary: "Visual path — select slide images"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.select-slide-images"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.build_image_shortlists.output"
    - id: assemble_plan
      summary: "Join text and images into slide plan"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.assemble-plan"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.select_slide_images.output"
    - id: render_store_pngs
      summary: "Render and persist slide PNGs"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.render-store-pngs"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.assemble_plan.output"
    - id: validate_output
      summary: "Validate generated output"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.validate-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.render_store_pngs.output"
    - id: finalize_output
      summary: "Persist run, output, and media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "slideshow-generation.finalize-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.validate_output.output"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  x-lumenclip-hide-input-node: true
  properties:
    automation_id:
      type: string
      format: dynselect-automation_id
      title: Template
    hook:
      type: string
      format: dynselect-hook
      title: Hook override (optional)
      description: Choose one saved hook instead of letting the template rotate hooks automatically.
    content_controls:
      type: object
      title: Content overrides
      additionalProperties: false
      properties:
        language:
          type: string
          title: Language
        tone:
          type: string
          format: textarea
          title: Tone
        slide_count:
          type: integer
          title: Slide count
          minimum: 1
          maximum: 30
        hook_content_direction:
          type: string
          format: textarea
          title: Hook content direction
        body_content_direction:
          type: string
          format: textarea
          title: Content direction
        cta_content_direction:
          type: string
          format: textarea
          title: CTA content direction
    collection_overrides:
      type: object
      title: Collection overrides
      additionalProperties: false
      properties:
        hook_collection_id:
          type: string
          format: dynselect-hook_collection_id
          title: Hook collection
        body_collection_id:
          type: string
          format: dynselect-body_collection_id
          title: Content collection
        cta_collection_id:
          type: string
          format: dynselect-cta_collection_id
          title: CTA collection
    slide_overrides:
      type: array
      title: Individual slide overrides
      items:
        type: object
        additionalProperties: false
        properties:
          slide_number:
            type: integer
            title: Slide number
            minimum: 1
            maximum: 30
          content_direction:
            type: string
            format: textarea
            title: Content direction
          collection_id:
            type: string
            format: dynselect-slide_collection_id
            title: Collection
        required: [slide_number]
  required: [automation_id]
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import { Client, Query, TablesDB } from \"node-appwrite\"\nimport * as wmill from \"windmill-client\"\n\nexport async function automation_id(filterText = \"\") {\n  return templateOptions({\"table\":\"templates\",\"automationKind\":\"slideshow\"}, filterText)\n}\n\nexport async function hook(automation_id = \"\", filterText = \"\") {\n  return hookOptions(automation_id, filterText)\n}\n\nexport async function hook_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nexport async function body_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nexport async function cta_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nexport async function slide_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nasync function templateOptions(config: {\n  table: \"templates\" | \"social_templates\"\n  automationKind?: string\n  videoFormat?: string\n  excludedVideoFormats?: string[]\n  platforms?: string[]\n}, filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    config.table === \"templates\"\n      ? [\"templates\", \"automations\"]\n      : [\"social_templates\", \"x_automations\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)]\n  )\n  const query = clean(filterText).toLowerCase()\n  return response.rows.flatMap((row) => {\n    const record = parseRecord(row.data)\n    if (!record || record.hidden === true || record.deletedAt) return []\n    const schema = parseRecord(record.schema) || {}\n    const automationKind = clean(schema.automationKind)\n    const videoFormat = clean(parseRecord(schema.video_format)?.template)\n    const platform = clean(record.platform)\n    if (config.automationKind && automationKind !== config.automationKind) return []\n    if (config.videoFormat && videoFormat !== config.videoFormat) return []\n    if (config.excludedVideoFormats?.includes(videoFormat)) return []\n    if (config.platforms?.length && !config.platforms.includes(platform)) return []\n    const value = clean(record.id) || clean(row.rid)\n    const name = clean(record.name)\n    if (!value || !name) return []\n    const detail = platform || videoFormat.replaceAll(\"_\", \" \") || automationKind\n    const label = detail ? name + \" · \" + detail : name\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{ value, label }]\n  })\n}\n\nasync function hookOptions(templateId = \"\", filterText = \"\") {\n  const id = clean(templateId)\n  if (!id) return []\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"templates\", \"automations\"],\n    [\n      Query.equal(\"owner_id\", [ownerId]),\n      Query.equal(\"rid\", [id]),\n      Query.limit(1),\n    ]\n  )\n  const record = parseRecord(response.rows[0]?.data)\n  const schema = parseRecord(record?.schema)\n  const hooks = Array.isArray(schema?.hooks) ? schema.hooks : []\n  const query = clean(filterText).toLowerCase()\n  return hooks.flatMap((candidate) => {\n    const hook = parseRecord(candidate)\n    const text = clean(hook?.text)\n    if (!text || hook?.enabled === false) return []\n    if (query && !text.toLowerCase().includes(query)) return []\n    return [{ value: text, label: text }]\n  })\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"permanent_assets\", \"image_collections\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)],\n    { permanent_assets: Query.equal(\"source_key\", [\"image_collection\"]) }\n  )\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return response.rows.flatMap((row) => {\n    const collection = parseRecord(row.data)\n    if (!collection || collection.deletedAt) return []\n    const mediaKind = collection.mediaType === \"video\" ? \"video\" : \"image\"\n    const assetCount = Array.isArray(collection.images)\n      ? collection.images.filter((asset) => clean(asset?.image_link)).length\n      : 0\n    const name = clean(collection.name)\n    if (!name || !assetCount || mediaKind !== kind) return []\n    const label = name + \" (\" + assetCount + \")\"\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{\n      value: clean(collection.id) || clean(collection.externalId) || slug(name),\n      label,\n      mediaKind,\n      assetCount,\n    }]\n  })\n}\n\nasync function listRowsWithFallback(\n  tables: TablesDB,\n  databaseId: string,\n  tableIds: string[],\n  queries: string[],\n  tableQueries: Record<string, string> = {}\n) {\n  for (const tableId of tableIds) {\n    try {\n      return await tables.listRows(databaseId, tableId, [\n        ...queries,\n        ...(tableQueries[tableId] ? [tableQueries[tableId]] : []),\n      ])\n    } catch (error) {\n      if (Number((error as { code?: unknown })?.code) !== 404) throw error\n    }\n  }\n  throw new Error(\"No compatible LumenClip Appwrite table was found\")\n}\n\nasync function appwrite() {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const env = JSON.parse(required(\"runtime_env_json\", runtimeEnv))\n  const client = new Client()\n    .setEndpoint(required(\"APPWRITE_ENDPOINT\", env.APPWRITE_ENDPOINT))\n    .setProject(required(\"APPWRITE_PROJECT_ID\", env.APPWRITE_PROJECT_ID))\n    .setKey(required(\"APPWRITE_API_KEY\", env.APPWRITE_API_KEY))\n  return {\n    tables: new TablesDB(client),\n    databaseId: required(\"APPWRITE_DATABASE_ID\", env.APPWRITE_DATABASE_ID),\n    ownerId: required(\"default_owner_id\", defaultOwnerId),\n  }\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n\nfunction parseRecord(value: unknown): Record<string, any> | null {\n  if (value && typeof value === \"object\" && !Array.isArray(value)) {\n    return value as Record<string, any>\n  }\n  if (typeof value !== \"string\") return null\n  try {\n    const parsed = JSON.parse(value)\n    return parsed && typeof parsed === \"object\" ? parsed : null\n  } catch {\n    return null\n  }\n}\n\nfunction clean(value: unknown) {\n  return typeof value === \"string\" ? value.trim() : \"\"\n}\n\nfunction slug(value: string) {\n  return value.toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\")\n}\n"
