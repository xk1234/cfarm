        input_transforms:
          base_url:
            type: static
            value: $var:f/lumenclip/internal_base_url
          shared_secret:
            type: static
            value: $var:f/lumenclip/shared_secret
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
