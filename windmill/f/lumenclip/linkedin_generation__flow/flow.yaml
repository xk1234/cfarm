schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - niche
    - topic
    - excluded_topics
    - proof
    - persona
    - brief
    - brief_model
    - model
    - count
  properties:
    niche:
      type: string
      title: Niche
      description: The audience or market this content is for.
    topic:
      type: string
      title: Topic
      description: Optional topic for this generation.
    excluded_topics:
      type: array
      title: Excluded topics
      items: { type: string }
    proof:
      type: array
      title: Proof bank
      items: { type: string }
    persona:
      type: string
      title: Voice
      enum:
        - educator
        - practitioner
      default: educator
    brief:
      type: object
      title: Supplied niche brief
    brief_model:
      type: string
      title: Brief model override
    model:
      type: string
      title: Post model override
    count:
      type: integer
      title: Posts
      minimum: 1
      maximum: 4
      default: 1
  required:
    - niche
