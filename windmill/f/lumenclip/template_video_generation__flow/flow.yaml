summary: "lumenclip - template video generation"
description: "Generate every non-UGC video template through independent copy and media paths that join at render assembly."
value:
  modules:
    - id: load_template
      summary: "Load and validate video template"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.load-template"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id })"
    - id: prepare_copy_and_media
      summary: "Prepare independent copy and media artifacts"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Copy generation"
            modules:
              - id: generate_copy
                summary: "Generate hook, captions, and post metadata"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "template-video-generation.generate-copy"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.load_template.output"
          - summary: "Media resolution"
            modules:
              - id: resolve_media
                summary: "Resolve configured media for every segment"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "template-video-generation.resolve-media"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.load_template.output"
    - id: assemble_components
      summary: "Join copy and media at renderer input"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.assemble-components"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ generation: results.load_template.output.generation, template: results.load_template.output.template, copy: results.prepare_copy_and_media[0].output.copy, resolvedMedia: results.prepare_copy_and_media[1].output.resolvedMedia })"
    - id: stage_media
      summary: "Stage selected render media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.stage-media"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.assemble_components.output"
    - id: build_render_command
      summary: "Build template FFmpeg command"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.build-render-command"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.stage_media.output"
    - id: render_store_output
      summary: "Render and store video artifacts"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.render-store-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.build_render_command.output"
    - id: finalize_output
      summary: "Persist unpublished video output"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.finalize-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.render_store_output.output"
    - id: discard_staged_media
      summary: "Discard temporary source media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "template-video-generation.discard-staged-media"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.finalize_output.output"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    template_id:
      type: object
      format: dynselect-template_id
      title: Video template
  required: [template_id]
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import { Client, Query, TablesDB } from \"node-appwrite\"\nimport * as wmill from \"windmill-client\"\n\nexport async function template_id(filterText = \"\") {\n  return templateOptions({\"table\":\"templates\",\"automationKind\":\"video\",\"excludedVideoFormats\":[\"ugc_ad\",\"react_reveal\",\"greenscreen_meme\"]}, filterText)\n}\n\nasync function templateOptions(config: {\n  table: \"templates\" | \"social_templates\"\n  automationKind?: string\n  videoFormat?: string\n  excludedVideoFormats?: string[]\n  platforms?: string[]\n}, filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    config.table === \"templates\"\n      ? [\"templates\", \"automations\"]\n      : [\"social_templates\", \"x_automations\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)]\n  )\n  const query = clean(filterText).toLowerCase()\n  return response.rows.flatMap((row) => {\n    const record = parseRecord(row.data)\n    if (!record || record.hidden === true || record.deletedAt) return []\n    const schema = parseRecord(record.schema) || {}\n    const automationKind = clean(schema.automationKind)\n    const videoFormat = clean(parseRecord(schema.video_format)?.template)\n    const platform = clean(record.platform)\n    if (config.automationKind && automationKind !== config.automationKind) return []\n    if (config.videoFormat && videoFormat !== config.videoFormat) return []\n    if (config.excludedVideoFormats?.includes(videoFormat)) return []\n    if (config.platforms?.length && !config.platforms.includes(platform)) return []\n    const value = clean(record.id) || clean(row.rid)\n    const name = clean(record.name)\n    if (!value || !name) return []\n    const detail = platform || videoFormat.replaceAll(\"_\", \" \") || automationKind\n    const label = detail ? name + \" · \" + detail : name\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{ value, label }]\n  })\n}\n\nasync function hookOptions(templateId = \"\", filterText = \"\") {\n  const id = clean(templateId)\n  if (!id) return []\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"templates\", \"automations\"],\n    [\n      Query.equal(\"owner_id\", [ownerId]),\n      Query.equal(\"rid\", [id]),\n      Query.limit(1),\n    ]\n  )\n  const record = parseRecord(response.rows[0]?.data)\n  const schema = parseRecord(record?.schema)\n  const hooks = Array.isArray(schema?.hooks) ? schema.hooks : []\n  const query = clean(filterText).toLowerCase()\n  return hooks.flatMap((candidate) => {\n    const hook = parseRecord(candidate)\n    const text = clean(hook?.text)\n    if (!text || hook?.enabled === false) return []\n    if (query && !text.toLowerCase().includes(query)) return []\n    return [{ value: text, label: text }]\n  })\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"permanent_assets\", \"image_collections\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)],\n    { permanent_assets: Query.equal(\"source_key\", [\"image_collection\"]) }\n  )\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return response.rows.flatMap((row) => {\n    const collection = parseRecord(row.data)\n    if (!collection || collection.deletedAt) return []\n    const mediaKind = collection.mediaType === \"video\" ? \"video\" : \"image\"\n    const assetCount = Array.isArray(collection.images)\n      ? collection.images.filter((asset) => clean(asset?.image_link)).length\n      : 0\n    const name = clean(collection.name)\n    if (!name || !assetCount || mediaKind !== kind) return []\n    const label = name + \" (\" + assetCount + \")\"\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{\n      value: clean(collection.id) || clean(collection.externalId) || slug(name),\n      label,\n      mediaKind,\n      assetCount,\n    }]\n  })\n}\n\nasync function listRowsWithFallback(\n  tables: TablesDB,\n  databaseId: string,\n  tableIds: string[],\n  queries: string[],\n  tableQueries: Record<string, string> = {}\n) {\n  for (const tableId of tableIds) {\n    try {\n      return await tables.listRows(databaseId, tableId, [\n        ...queries,\n        ...(tableQueries[tableId] ? [tableQueries[tableId]] : []),\n      ])\n    } catch (error) {\n      if (Number((error as { code?: unknown })?.code) !== 404) throw error\n    }\n  }\n  throw new Error(\"No compatible LumenClip Appwrite table was found\")\n}\n\nasync function appwrite() {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const env = JSON.parse(required(\"runtime_env_json\", runtimeEnv))\n  const client = new Client()\n    .setEndpoint(required(\"APPWRITE_ENDPOINT\", env.APPWRITE_ENDPOINT))\n    .setProject(required(\"APPWRITE_PROJECT_ID\", env.APPWRITE_PROJECT_ID))\n    .setKey(required(\"APPWRITE_API_KEY\", env.APPWRITE_API_KEY))\n  return {\n    tables: new TablesDB(client),\n    databaseId: required(\"APPWRITE_DATABASE_ID\", env.APPWRITE_DATABASE_ID),\n    ownerId: required(\"default_owner_id\", defaultOwnerId),\n  }\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n\nfunction parseRecord(value: unknown): Record<string, any> | null {\n  if (value && typeof value === \"object\" && !Array.isArray(value)) {\n    return value as Record<string, any>\n  }\n  if (typeof value !== \"string\") return null\n  try {\n    const parsed = JSON.parse(value)\n    return parsed && typeof parsed === \"object\" ? parsed : null\n  } catch {\n    return null\n  }\n}\n\nfunction clean(value: unknown) {\n  return typeof value === \"string\" ? value.trim() : \"\"\n}\n\nfunction slug(value: string) {\n  return value.toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\")\n}\n"
