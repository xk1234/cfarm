schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    template_id:
      type: object
      format: dynselect-template_id
      title: Template (optional)
    anticipation:
      type: object
      title: Anticipation clip
      properties:
        url: { type: string, title: Full clip URL }
      required: [url]
    reveal:
      type: object
      title: Reveal clip
      properties:
        url: { type: string, title: Full clip URL }
      required: [url]
    hook_caption: { type: string, title: Hook caption }
    payoff_caption: { type: string, title: Payoff caption }
    audio:
      type: object
      title: Soundtrack (optional)
      properties:
        url: { type: string, title: Audio URL }
    output:
      type: object
      title: Draft output
      properties:
        title: { type: string }
        description: { type: string, format: textarea }
        hashtags:
          type: array
          items: { type: string }
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import * as wmill from \"windmill-client\"\n\nexport async function template_id(filterText = \"\") {\n  const [baseUrlValue, secretValue, ownerIdValue] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/internal_base_url\"),\n    wmill.getVariable(\"f/lumenclip/shared_secret\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const baseUrl = required(\"internal_base_url\", baseUrlValue).replace(/\\/$/, \"\")\n  const secret = required(\"shared_secret\", secretValue)\n  const ownerId = required(\"default_owner_id\", ownerIdValue)\n  const response = await fetch(`${baseUrl}/api/internal/windmill/templates`, {\n    method: \"POST\",\n    headers: {\n      authorization: `Bearer ${secret}`,\n      \"content-type\": \"application/json\",\n    },\n    body: JSON.stringify({ ownerId, kind: \"video\" }),\n  })\n  const payload = await response.json()\n  if (!response.ok || !Array.isArray(payload.options)) {\n    throw new Error(payload.error || `Template lookup failed with ${response.status}`)\n  }\n  const query = filterText.trim().toLowerCase()\n  return query\n    ? payload.options.filter((option) => option.label.toLowerCase().includes(query))\n    : payload.options\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(`Lumenclip variable ${name} is not configured`)\n  return text\n}"
