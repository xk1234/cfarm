summary: "lumenclip - React & Reveal generation"
description: "Play a full anticipation clip followed by a full reveal clip through named media, render, and draft-output components."
value:
  modules:
    - id: load_template_defaults
      summary: "Load and validate optional format template"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "react-reveal-generation.load-template-defaults"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id })"
    - id: render_and_output_metadata
      summary: "Render media while draft metadata is normalized"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Format render path"
            modules:
              - id: resolve_and_stage_render_inputs
                summary: "Resolve and stage inputs first consumed by the renderer"
                value:
                  type: branchall
                  parallel: true
                  branches:
                    - summary: "anticipation media"
                      modules:
                      - id: resolve_anticipation
                        summary: "Merge and validate anticipation media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.resolve-anticipation"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { collectionId: flow_input.anticipation_collection_id } })"
                      - id: stage_anticipation
                        summary: "Stage anticipation media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.stage-anticipation"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_anticipation.output.generation, components: { anticipation: results.resolve_anticipation.output.component } })"
                    - summary: "reveal media"
                      modules:
                      - id: resolve_reveal
                        summary: "Merge and validate reveal media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.resolve-reveal"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { collectionId: flow_input.reveal_collection_id } })"
                      - id: stage_reveal
                        summary: "Stage reveal media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.stage-reveal"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_reveal.output.generation, components: { reveal: results.resolve_reveal.output.component } })"
                    - summary: "Optional soundtrack"
                      modules:
                      - id: resolve_audio
                        summary: "Merge and validate optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.resolve-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: {} })"
                      - id: stage_audio
                        summary: "Stage optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.stage-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_audio.output.generation, components: { audio: results.resolve_audio.output.component } })"
                    - summary: "Format captions"
                      modules:
                      - id: resolve_caption
                        summary: "Normalize captions consumed by the renderer"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.resolve-caption"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { hookCaption: flow_input.hook_caption, payoffCaption: flow_input.payoff_caption } })"
              - id: build_render_command
                summary: "Join full anticipation, full reveal, audio, and captions"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "react-reveal-generation.build-render-command"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, components: { anticipation: results.resolve_and_stage_render_inputs[0].output.components.anticipation, reveal: results.resolve_and_stage_render_inputs[1].output.components.reveal, audio: results.resolve_and_stage_render_inputs[2].output.components.audio, ...results.resolve_and_stage_render_inputs[3].output.component }, stagedMedia: { anticipation: results.resolve_and_stage_render_inputs[0].output.stagedMedia.anticipation, reveal: results.resolve_and_stage_render_inputs[1].output.stagedMedia.reveal, audio: results.resolve_and_stage_render_inputs[2].output.stagedMedia?.audio } })"
              - id: render_store_output
                summary: "Render and store video artifacts"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "react-reveal-generation.render-store-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.build_render_command.output"
          - summary: "Draft output metadata"
            modules:
              - id: resolve_output
                summary: "Normalize metadata consumed by draft finalization"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "react-reveal-generation.resolve-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.output })"
    - id: finalize_output
      summary: "Create draft video output"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "react-reveal-generation.finalize-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ ...results.render_and_output_metadata[0].output, components: { ...results.render_and_output_metadata[0].output.components, ...results.render_and_output_metadata[1].output.component } })"
    - id: discard_staged_media
      summary: "Discard temporary source media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "react-reveal-generation.discard-staged-media"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.finalize_output.output"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    template_id:
      type: string
      title: Template (optional)
    anticipation_collection_id:
      type: object
      format: dynselect-anticipation_collection_id
      title: Anticipation video collection
      description: Pick a collection; each run selects one full clip from it.
    reveal_collection_id:
      type: object
      format: dynselect-reveal_collection_id
      title: Reveal video collection
      description: Pick a collection; each run selects one full clip from it.
    hook_caption: { type: string, title: Hook caption }
    payoff_caption: { type: string, title: Payoff caption }
    output:
      type: object
      title: Draft output
      properties:
        title: { type: string }
        description: { type: string, format: textarea }
        hashtags:
          type: array
          items: { type: string }
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import * as wmill from \"windmill-client\"\n\nexport async function anticipation_collection_id(filterText = \"\") {\n  return mediaCollections(\"video\", filterText)\n}\n\nexport async function reveal_collection_id(filterText = \"\") {\n  return mediaCollections(\"video\", filterText)\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const result = await wmill.runScript(\n    \"f/lumenclip/workflow_stage_runtime\",\n    null,\n    {\n      runtime_env_json: required(\"runtime_env_json\", runtimeEnv),\n      default_owner_id: required(\"default_owner_id\", defaultOwnerId),\n      stage_id: \"slideshow-generation.list-media-collection-options\",\n      stage_input: { mediaKind: kind },\n      request_id: \"media-picker-\" + crypto.randomUUID(),\n    }\n  )\n  const options = Array.isArray(result?.output?.options)\n    ? result.output.options\n    : []\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return options\n    .filter((option) => !query || option.label.toLowerCase().includes(query))\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n\n}"
