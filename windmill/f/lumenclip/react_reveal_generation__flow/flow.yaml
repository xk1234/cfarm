ut: unknown) {\n  const value = typeof input === \"string\" ? input.trim() : \"\"\n  if (!value) throw new Error(`Lumenclip ${name} is not configured`)\n  return value\n}"
                          input_transforms:
                            base_url:
                              type: static
                              value: $var:f/lumenclip/internal_base_url
                            shared_secret:
                              type: static
                              value: $var:f/lumenclip/shared_secret
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "react-reveal-generation.resolve-anticipation"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.anticipation })"
