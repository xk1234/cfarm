schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - owner_id
    - request_id
    - input
    - start_at
    - stop_after
  properties:
    input:
      type: object
      additionalProperties: true
      description: Initial structured input for the first workflow stage.
    owner_id:
      type: string
      description: Lumenclip owner whose data this workflow may access.
    request_id:
      type: string
      description: Stable idempotency key for this workflow run.
    start_at:
      type: string
      description: Optional first stage for a partial workflow run.
      enum:
        - x-threads-generation.validate-input
        - x-threads-generation.resolve-brief
        - x-threads-generation.select-content-plan
        - x-threads-generation.build-generation-request
        - x-threads-generation.generate-draft
        - x-threads-generation.humanize-draft
        - x-threads-generation.review-draft
        - x-threads-generation.validate-draft
        - x-threads-generation.repair-draft
        - x-threads-generation.benchmark-build-run
        - x-threads-generation.persist-run-memory
        - x-threads-generation.generate-image
    stop_after:
      type: string
      description: Optional final stage for a partial workflow run.
      enum:
        - x-threads-generation.validate-input
        - x-threads-generation.resolve-brief
        - x-threads-generation.select-content-plan
        - x-threads-generation.build-generation-request
        - x-threads-generation.generate-draft
        - x-threads-generation.humanize-draft
        - x-threads-generation.review-draft
        - x-threads-generation.validate-draft
        - x-threads-generation.repair-draft
        - x-threads-generation.benchmark-build-run
        - x-threads-generation.persist-run-memory
        - x-threads-generation.generate-image
  required:
    - owner_id
    - request_id
    - input
