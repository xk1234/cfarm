summary: lumenclip - X and Threads generation
description: Generate X or Threads content through individually observable and
  composable stages.
value:
  modules:
    - id: validate_input
      summary: Validate and normalize input
      value:
        type: script
        input_transforms:
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_id:
            type: static
            value: x-threads-generation.validate-input
          stage_input:
            type: javascript
            expr: flow_input.input
        path: f/lumenclip/run_pipeline_stage
      skip_if:
        expr: flow_input.start_at &&
          ["x-threads-generation.validate-input","x-threads-generation.resolve-brief","x-threads-generation.select-content-plan","x-threads-generation.build-generation-request","x-threads-generation.generate-draft","x-threads-generation.humanize-draft","x-threads-generation.review-draft","x-threads-generation.validate-draft","x-threads-generation.repair-draft","x-threads-generation.benchmark-build-run","x-threads-generation.persist-run-memory","x-threads-generation.generate-image"].indexOf(flow_input.start_at)
          > 0
      stop_after_if:
        expr: result.status === "running" || flow_input.stop_after ===
          "x-threads-generation.validate-input"
        skip_if_stopped: false
    - id: resolve_brief
      summary: Resolve required niche brief
      value:
        type: script
