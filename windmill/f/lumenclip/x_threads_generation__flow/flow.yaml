summary: "lumenclip - X and Threads generation"
description: "Generate X or Threads content through individually observable and composable stages."
value:
  modules:
    - id: validate_input
      summary: "Validate and normalize input"
      skip_if:
        expr: flow_input.start_at && ["x-threads-generation.validate-input","x-threads-generation.resolve-brief","x-threads-generation.select-content-plan","x-threads-generation.build-generation-request","x-threads-generation.generate-draft","x-threads-generation.humanize-draft","x-threads-generation.review-draft","x-threads-generation.validate-draft","x-threads-generation.repair-draft","x-threads-generation.benchmark-build-run","x-threads-generation.persist-run-memory","x-threads-generation.generate-image"].indexOf(flow_input.start_at) > 0
