          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ ...results.resolve_components.output, stagedMedia: { meme: results.stage_media_components[0].output.stagedMedia.meme, background: results.stage_media_components[1].output.stagedMedia.background, audio: results.stage_media_components[2].output.stagedMedia?.audio } })"
    - id: render_store_output
