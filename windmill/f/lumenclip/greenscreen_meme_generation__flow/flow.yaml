summary: "lumenclip - Greenscreen Meme generation"
description: "Chroma-key a full meme clip over a background with a hook caption through named media, render, and draft-output components."
value:
  modules:
    - id: load_template_defaults
      summary: "Load and validate optional format template"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.load-template-defaults"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id })"
    - id: render_and_output_metadata
      summary: "Render media while draft metadata is normalized"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Format render path"
            modules:
              - id: resolve_and_stage_render_inputs
                summary: "Resolve and stage inputs first consumed by the renderer"
                value:
                  type: branchall
                  parallel: true
                  branches:
                    - summary: "meme media"
                      modules:
                      - id: resolve_meme
                        summary: "Merge and validate meme media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-meme"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { collectionId: flow_input.meme_collection_id } })"
                      - id: stage_meme
                        summary: "Stage meme media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-meme"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_meme.output.generation, components: { meme: results.resolve_meme.output.component } })"
                    - summary: "background media"
                      modules:
                      - id: resolve_background
                        summary: "Merge and validate background media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-background"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { collectionId: flow_input.background_collection_id } })"
                      - id: stage_background
                        summary: "Stage background media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-background"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_background.output.generation, components: { background: results.resolve_background.output.component } })"
                    - summary: "Optional soundtrack"
                      modules:
                      - id: resolve_audio
                        summary: "Merge and validate optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: {} })"
                      - id: stage_audio
                        summary: "Stage optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_audio.output.generation, components: { audio: results.resolve_audio.output.component } })"
                    - summary: "Format captions"
                      modules:
                      - id: resolve_caption
                        summary: "Normalize captions consumed by the renderer"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-caption"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { caption: flow_input.caption, textPlacement: flow_input.text_placement } })"
              - id: build_render_command
                summary: "Join chroma-keyed meme, background, audio, and caption"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.build-render-command"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, components: { meme: results.resolve_and_stage_render_inputs[0].output.components.meme, background: results.resolve_and_stage_render_inputs[1].output.components.background, audio: results.resolve_and_stage_render_inputs[2].output.components.audio, ...results.resolve_and_stage_render_inputs[3].output.component }, stagedMedia: { meme: results.resolve_and_stage_render_inputs[0].output.stagedMedia.meme, background: results.resolve_and_stage_render_inputs[1].output.stagedMedia.background, audio: results.resolve_and_stage_render_inputs[2].output.stagedMedia?.audio } })"
              - id: render_store_output
                summary: "Render and store video artifacts"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.render-store-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.build_render_command.output"
          - summary: "Draft output metadata"
            modules:
              - id: resolve_output
                summary: "Normalize metadata consumed by draft finalization"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.resolve-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.output })"
    - id: finalize_output
      summary: "Create draft video output"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.finalize-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ ...results.render_and_output_metadata[0].output, components: { ...results.render_and_output_metadata[0].output.components, ...results.render_and_output_metadata[1].output.component } })"
    - id: discard_staged_media
      summary: "Discard temporary source media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.discard-staged-media"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.finalize_output.output"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  x-lumenclip-hide-input-node: true
  properties:
    template_id:
      type: string
      format: dynselect-template_id
      title: Template (optional)
    meme_collection_id:
      type: object
      format: dynselect-meme_collection_id
      title: Greenscreen video collection
      description: Pick a collection; each run selects one full greenscreen clip from it.
    background_collection_id:
      type: object
      format: dynselect-background_collection_id
      title: Background photo collection
      description: Pick a collection; each run selects one background photo from it.
    caption: { type: string, title: Hook caption }
    text_placement:
      type: string
      title: Caption placement
      enum: [top, middle, bottom]
      default: top
    output:
      type: object
      title: Draft output
      properties:
        title: { type: string }
        description: { type: string, format: textarea }
        hashtags:
          type: array
          items: { type: string }
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import { Client, Query, TablesDB } from \"node-appwrite\"\nimport * as wmill from \"windmill-client\"\n\nexport async function template_id(filterText = \"\") {\n  return templateOptions({\"table\":\"templates\",\"automationKind\":\"video\",\"videoFormat\":\"greenscreen_meme\"}, filterText)\n}\n\nexport async function meme_collection_id(filterText = \"\") {\n  return mediaCollections(\"video\", filterText)\n}\n\nexport async function background_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nasync function templateOptions(config: {\n  table: \"templates\" | \"social_templates\"\n  automationKind?: string\n  videoFormat?: string\n  excludedVideoFormats?: string[]\n  platforms?: string[]\n}, filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    config.table === \"templates\"\n      ? [\"templates\", \"automations\"]\n      : [\"social_templates\", \"x_automations\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)]\n  )\n  const query = clean(filterText).toLowerCase()\n  return response.rows.flatMap((row) => {\n    const record = parseRecord(row.data)\n    if (!record || record.hidden === true || record.deletedAt) return []\n    const schema = parseRecord(record.schema) || {}\n    const automationKind = clean(schema.automationKind)\n    const videoFormat = clean(parseRecord(schema.video_format)?.template)\n    const platform = clean(record.platform)\n    if (config.automationKind && automationKind !== config.automationKind) return []\n    if (config.videoFormat && videoFormat !== config.videoFormat) return []\n    if (config.excludedVideoFormats?.includes(videoFormat)) return []\n    if (config.platforms?.length && !config.platforms.includes(platform)) return []\n    const value = clean(record.id) || clean(row.rid)\n    const name = clean(record.name)\n    if (!value || !name) return []\n    const detail = platform || videoFormat.replaceAll(\"_\", \" \") || automationKind\n    const label = detail ? name + \" · \" + detail : name\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{ value, label }]\n  })\n}\n\nasync function hookOptions(templateId = \"\", filterText = \"\") {\n  const id = clean(templateId)\n  if (!id) return []\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"templates\", \"automations\"],\n    [\n      Query.equal(\"owner_id\", [ownerId]),\n      Query.equal(\"rid\", [id]),\n      Query.limit(1),\n    ]\n  )\n  const record = parseRecord(response.rows[0]?.data)\n  const schema = parseRecord(record?.schema)\n  const hooks = Array.isArray(schema?.hooks) ? schema.hooks : []\n  const query = clean(filterText).toLowerCase()\n  return hooks.flatMap((candidate) => {\n    const hook = parseRecord(candidate)\n    const text = clean(hook?.text)\n    if (!text || hook?.enabled === false) return []\n    if (query && !text.toLowerCase().includes(query)) return []\n    return [{ value: text, label: text }]\n  })\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"permanent_assets\", \"image_collections\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)],\n    { permanent_assets: Query.equal(\"source_key\", [\"image_collection\"]) }\n  )\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return response.rows.flatMap((row) => {\n    const collection = parseRecord(row.data)\n    if (!collection || collection.deletedAt) return []\n    const mediaKind = collection.mediaType === \"video\" ? \"video\" : \"image\"\n    const assetCount = Array.isArray(collection.images)\n      ? collection.images.filter((asset) => clean(asset?.image_link)).length\n      : 0\n    const name = clean(collection.name)\n    if (!name || !assetCount || mediaKind !== kind) return []\n    const label = name + \" (\" + assetCount + \")\"\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{\n      value: clean(collection.id) || clean(collection.externalId) || slug(name),\n      label,\n      mediaKind,\n      assetCount,\n    }]\n  })\n}\n\nasync function listRowsWithFallback(\n  tables: TablesDB,\n  databaseId: string,\n  tableIds: string[],\n  queries: string[],\n  tableQueries: Record<string, string> = {}\n) {\n  for (const tableId of tableIds) {\n    try {\n      return await tables.listRows(databaseId, tableId, [\n        ...queries,\n        ...(tableQueries[tableId] ? [tableQueries[tableId]] : []),\n      ])\n    } catch (error) {\n      if (Number((error as { code?: unknown })?.code) !== 404) throw error\n    }\n  }\n  throw new Error(\"No compatible LumenClip Appwrite table was found\")\n}\n\nasync function appwrite() {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const env = JSON.parse(required(\"runtime_env_json\", runtimeEnv))\n  const client = new Client()\n    .setEndpoint(required(\"APPWRITE_ENDPOINT\", env.APPWRITE_ENDPOINT))\n    .setProject(required(\"APPWRITE_PROJECT_ID\", env.APPWRITE_PROJECT_ID))\n    .setKey(required(\"APPWRITE_API_KEY\", env.APPWRITE_API_KEY))\n  return {\n    tables: new TablesDB(client),\n    databaseId: required(\"APPWRITE_DATABASE_ID\", env.APPWRITE_DATABASE_ID),\n    ownerId: required(\"default_owner_id\", defaultOwnerId),\n  }\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n\nfunction parseRecord(value: unknown): Record<string, any> | null {\n  if (value && typeof value === \"object\" && !Array.isArray(value)) {\n    return value as Record<string, any>\n  }\n  if (typeof value !== \"string\") return null\n  try {\n    const parsed = JSON.parse(value)\n    return parsed && typeof parsed === \"object\" ? parsed : null\n  } catch {\n    return null\n  }\n}\n\nfunction clean(value: unknown) {\n  return typeof value === \"string\" ? value.trim() : \"\"\n}\n\nfunction slug(value: string) {\n  return value.toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\")\n}\n"
