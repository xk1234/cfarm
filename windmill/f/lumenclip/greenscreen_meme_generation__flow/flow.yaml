summary: "lumenclip - Greenscreen Meme generation"
description: "Chroma-key a full meme clip over a background with a hook caption through named media, render, and draft-output components."
value:
  modules:
    - id: load_template_defaults
      summary: "Load and validate optional format template"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.load-template-defaults"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id })"
    - id: render_and_output_metadata
      summary: "Render media while draft metadata is normalized"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Format render path"
            modules:
              - id: resolve_and_stage_render_inputs
                summary: "Resolve and stage inputs first consumed by the renderer"
                value:
                  type: branchall
                  parallel: true
                  branches:
                    - summary: "meme media"
                      modules:
                      - id: resolve_meme
                        summary: "Merge and validate meme media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-meme"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.meme })"
                      - id: stage_meme
                        summary: "Stage meme media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-meme"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_meme.output.generation, components: { meme: results.resolve_meme.output.component } })"
                    - summary: "background media"
                      modules:
                      - id: resolve_background
                        summary: "Merge and validate background media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-background"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.background })"
                      - id: stage_background
                        summary: "Stage background media"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-background"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_background.output.generation, components: { background: results.resolve_background.output.component } })"
                    - summary: "Optional soundtrack"
                      modules:
                      - id: resolve_audio
                        summary: "Merge and validate optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.audio })"
                      - id: stage_audio
                        summary: "Stage optional soundtrack"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.stage-audio"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.resolve_audio.output.generation, components: { audio: results.resolve_audio.output.component } })"
                    - summary: "Format captions"
                      modules:
                      - id: resolve_caption
                        summary: "Normalize captions consumed by the renderer"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "greenscreen-meme-generation.resolve-caption"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { caption: flow_input.caption, textPlacement: flow_input.text_placement } })"
              - id: build_render_command
                summary: "Join chroma-keyed meme, background, audio, and caption"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.build-render-command"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, components: { meme: results.resolve_and_stage_render_inputs[0].output.components.meme, background: results.resolve_and_stage_render_inputs[1].output.components.background, audio: results.resolve_and_stage_render_inputs[2].output.components.audio, ...results.resolve_and_stage_render_inputs[3].output.component }, stagedMedia: { meme: results.resolve_and_stage_render_inputs[0].output.stagedMedia.meme, background: results.resolve_and_stage_render_inputs[1].output.stagedMedia.background, audio: results.resolve_and_stage_render_inputs[2].output.stagedMedia?.audio } })"
              - id: render_store_output
                summary: "Render and store video artifacts"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.render-store-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "results.build_render_command.output"
          - summary: "Draft output metadata"
            modules:
              - id: resolve_output
                summary: "Normalize metadata consumed by draft finalization"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "greenscreen-meme-generation.resolve-output"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.output })"
    - id: finalize_output
      summary: "Create draft video output"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.finalize-output"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ ...results.render_and_output_metadata[0].output, components: { ...results.render_and_output_metadata[0].output.components, ...results.render_and_output_metadata[1].output.component } })"
    - id: discard_staged_media
      summary: "Discard temporary source media"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "greenscreen-meme-generation.discard-staged-media"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "results.finalize_output.output"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    template_id:
      type: string
      title: Template (optional)
    meme:
      type: object
      title: Greenscreen meme clip
      properties:
        url: { type: string, title: Full clip URL }
      required: [url]
    background:
      type: object
      title: Background image
      properties:
        url: { type: string, title: Image URL }
      required: [url]
    caption: { type: string, title: Hook caption }
    text_placement:
      type: string
      title: Caption placement
      enum: [top, middle, bottom]
      default: top
    audio:
      type: object
      title: Soundtrack (optional)
      properties:
        url: { type: string, title: Audio URL }
    output:
      type: object
      title: Draft output
      properties:
        title: { type: string }
        description: { type: string, format: textarea }
        hashtags:
          type: array
          items: { type: string }
