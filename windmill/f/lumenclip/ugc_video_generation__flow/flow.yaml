summary: "lumenclip - UGC video generation"
description: "Generate a UGC product video through individually observable and composable stages."
value:
  modules:
    - id: resolve_input_groups
      summary: "Resolve independent UGC input groups"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Template reference"
            modules:
              - id: template_input
                summary: "Template defaults reference"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "({ templateId: flow_input.template_id })"
          - summary: "Product input"
            modules:
              - id: product_input
                summary: "Product component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.product ?? {}"
          - summary: "Script input"
            modules:
              - id: script_input
                summary: "Script component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.script ?? {}"
          - summary: "Actor input"
            modules:
              - id: actor_input
                summary: "Actor component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.actor ?? {}"
          - summary: "Voice input"
            modules:
              - id: voice_input
                summary: "Voice component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.voice ?? {}"
          - summary: "B-roll input"
            modules:
              - id: broll_input
                summary: "B-roll component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.broll ?? {}"
          - summary: "Render input"
            modules:
              - id: render_input
                summary: "Render component input"
                value:
                  type: rawscript
                  language: bun
                  content: "export async function main(artifact: Record<string, unknown>) { return { output: { artifact } } }"
                  input_transforms:
                    artifact:
                      type: javascript
                      expr: "flow_input.render ?? {}"
    - id: resolve_components
      summary: "Resolve template and component overrides"
      timeout:
        type: static
        value: 300
      value:
        type: rawscript
        language: bun
        content: "type PipelineStageExecution = {\n  stage: { id: string; workflowId: string }\n  requestId: string\n  status: \"succeeded\" | \"running\"\n  externalCalls: number\n  output: Record<string, unknown>\n  operation?: Record<string, unknown>\n}\n\nexport async function main(\n  base_url: string,\n  shared_secret: string,\n  default_owner_id: string,\n  stage_id: string,\n  stage_input: Record<string, unknown>,\n  owner_id?: string,\n  request_id?: string\n): Promise<PipelineStageExecution> {\n  const resolvedOwnerId = owner_id?.trim() || required(\"default_owner_id\", default_owner_id)\n  const resolvedRequestId =\n    request_id?.trim() ||\n    process.env.WM_ROOT_FLOW_JOB_ID?.trim() ||\n    process.env.WM_FLOW_JOB_ID?.trim() ||\n    process.env.WM_JOB_ID?.trim() ||\n    `windmill-${crypto.randomUUID()}`\n  const response = await fetch(\n    `${required(\"base_url\", base_url).replace(/\\/$/, \"\")}/api/internal/windmill/stages/${encodeURIComponent(stage_id)}`,\n    {\n      method: \"POST\",\n      headers: {\n        authorization: `Bearer ${required(\"shared_secret\", shared_secret)}`,\n        \"content-type\": \"application/json\",\n      },\n      body: JSON.stringify({\n        ownerId: resolvedOwnerId,\n        requestId: resolvedRequestId,\n        input: stage_input,\n      }),\n    }\n  )\n  const payload = (await response.json().catch(() => null)) as {\n    execution?: PipelineStageExecution\n    error?: string\n  } | null\n  if (!response.ok || !payload?.execution) {\n    throw new Error(payload?.error || `Lumenclip stage request failed with ${response.status}`)\n  }\n  return payload.execution\n}\n\nfunction required(name: string, input: unknown) {\n  const value = typeof input === \"string\" ? input.trim() : \"\"\n  if (!value) throw new Error(`Lumenclip ${name} is not configured`)\n  return value\n}"
        input_transforms:
          base_url:
            type: static
            value: $var:f/lumenclip/internal_base_url
          shared_secret:
            type: static
            value: $var:f/lumenclip/shared_secret
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.resolve-components"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: results.resolve_input_groups[0].output.artifact.templateId, product: results.resolve_input_groups[1].output.artifact, script: results.resolve_input_groups[2].output.artifact, actor: results.resolve_input_groups[3].output.artifact, voice: results.resolve_input_groups[4].output.artifact, broll: results.resolve_input_groups[5].output.artifact, render: results.resolve_input_groups[6].output.artifact, generationId: flow_input.generation_id, scheduledFor: flow_input.scheduled_for })"
    - id: analyze_product
      summary: "Product component — analyze facts"
      timeout:
        type: static
        value: 1800
      value:
        type: rawscript
        language: bun
        content: "type PipelineStageExecution = {\n  stage: { id: string; workflowId: string }\n  requestId: string\n  status: \"succeeded\" | \"running\"\n  externalCalls: number\n  output: Record<string, unknown>\n  operation?: { id?: string; status?: string }\n}\n\nexport async function main(\n  base_url: string,\n  shared_secret: string,\n  default_owner_id: string,\n  stage_id: string,\n  checkpoint_name: string,\n  stage_input: Record<string, unknown>,\n  max_wait_seconds = 1500,\n  owner_id?: string,\n  request_id?: string\n): Promise<PipelineStageExecution> {\n  const ownerId = owner_id?.trim() || required(\"default_owner_id\", default_owner_id)\n  const requestId = request_id?.trim() || process.env.WM_ROOT_FLOW_JOB_ID?.trim() || process.env.WM_FLOW_JOB_ID?.trim() || process.env.WM_JOB_ID?.trim() || `windmill-${crypto.randomUUID()}`\n  const queued = await callStage(base_url, shared_secret, ownerId, requestId, stage_id, stage_input)\n  if (queued.status === \"succeeded\") return queued\n  const jobId = text(queued.operation?.id)\n  if (!jobId) throw new Error(`${checkpoint_name} did not return a queue job`)\n  const deadline = Date.now() + Math.max(30, max_wait_seconds) * 1000\n  while (Date.now() < deadline) {\n    await Bun.sleep(2000)\n    const polled = await callStage(\n      base_url,\n      shared_secret,\n      ownerId,\n      requestId,\n      \"ugc-video-generation.get-checkpoint-job\",\n      { jobId }\n    )\n    const job = record(polled.output.job)\n    const status = text(job.status)\n    if ([\"failed\", \"dead\", \"canceled\"].includes(status)) {\n      throw new Error(text(job.error) || `${checkpoint_name} component failed`)\n    }\n    if (status !== \"completed\") continue\n    const result = record(job.result)\n    if (result.skipped === true) {\n      throw new Error(`${checkpoint_name} component was skipped: ${text(result.reason) || \"unknown reason\"}`)\n    }\n    const artifact = record(record(result.checkpoints)[checkpoint_name])\n    if (!Object.keys(artifact).length) {\n      throw new Error(`${checkpoint_name} completed without a checkpoint artifact`)\n    }\n    return {\n      stage: queued.stage,\n      requestId,\n      status: \"succeeded\",\n      externalCalls: queued.externalCalls + polled.externalCalls,\n      output: {\n        component: checkpoint_name,\n        artifact,\n        generation: record(stage_input.generation),\n        operation: { id: jobId, status: \"succeeded\" },\n      },\n    }\n  }\n  throw new Error(`${checkpoint_name} component timed out after ${max_wait_seconds}s`)\n}\n\nasync function callStage(\n  baseUrl: string,\n  secret: string,\n  ownerId: string,\n  requestId: string,\n  stageId: string,\n  input: Record<string, unknown>\n) {\n  const response = await fetch(\n    `${required(\"base_url\", baseUrl).replace(/\\/$/, \"\")}/api/internal/windmill/stages/${encodeURIComponent(stageId)}`,\n    {\n      method: \"POST\",\n      headers: {\n        authorization: `Bearer ${required(\"shared_secret\", secret)}`,\n        \"content-type\": \"application/json\",\n      },\n      body: JSON.stringify({ ownerId, requestId, input }),\n    }\n  )\n  const payload = (await response.json().catch(() => null)) as { execution?: PipelineStageExecution; error?: string } | null\n  if (!response.ok || !payload?.execution) {\n    throw new Error(payload?.error || `Lumenclip stage request failed with ${response.status}`)\n  }\n  return payload.execution\n}\n\nfunction record(value: unknown): Record<string, any> {\n  return value && typeof value === \"object\" && !Array.isArray(value) ? value as Record<string, any> : {}\n}\nfunction text(value: unknown) {\n  return typeof value === \"string\" ? value.trim() : \"\"\n}\nfunction required(name: string, value: unknown) {\n  const result = text(value)\n  if (!result) throw new Error(`Lumenclip ${name} is not configured`)\n  return result\n}"
        input_transforms:
          base_url:
            type: static
            value: $var:f/lumenclip/internal_base_url
          shared_secret:
            type: static
            value: $var:f/lumenclip/shared_secret
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.analyze-product"
          checkpoint_name:
            type: static
            value: "analysis"
          max_wait_seconds:
            type: static
            value: 1500
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.resolve_components.output.generation, ...results.resolve_components.output.generation, components: results.resolve_components.output.components, checkpoints: {} })"
