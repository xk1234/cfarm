summary: "lumenclip - UGC video generation"
description: "Generate a UGC product video through individually observable and composable stages."
value:
  modules:
    - id: load_template_defaults
      summary: "Load and validate optional UGC template defaults"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.load-template-defaults"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id, generationId: flow_input.generation_id, scheduledFor: flow_input.scheduled_for })"
    - id: prepare_script_inputs
      summary: "Resolve product facts while script configuration is validated"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Product resolution and analysis"
            modules:
              - id: resolve_product_component
                summary: "Merge and validate product component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-product-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.product })"
              - id: analyze_product
                summary: "Product component — analyze facts"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.analyze-product"
                    checkpoint_name:
                      type: static
                      value: "analysis"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ product: results.resolve_product_component.output.component }), checkpoints: {} })"
          - summary: "Script configuration"
            modules:
              - id: resolve_script_component
                summary: "Merge and validate script component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-script-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.script })"
    - id: generate_script_plan
      summary: "Script component — hook, body, CTA and timing"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.generate-script-plan"
          checkpoint_name:
            type: static
            value: "script"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ product: results.prepare_script_inputs[0].output.components.product, script: results.prepare_script_inputs[1].output.component }), checkpoints: { analysis: results.prepare_script_inputs[0].output.artifact } })"
    - id: prepare_render_artifacts
      summary: "Prepare performance, B-roll, and render configuration for composite"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Actor, voice, and lip-sync performance"
            modules:
              - id: prepare_actor_voice
                summary: "Prepare actor motion and voice for their lip-sync join"
                value:
                  type: branchall
                  parallel: true
                  branches:
                    - summary: "Actor and motion"
                      modules:
                      - id: resolve_actor_component
                        summary: "Merge and validate actor component"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-actor-component"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { ...flow_input.actor, assetCollectionId: flow_input.actor_asset_collection_id } })"
                      - id: resolve_actor
                        summary: "Actor component — resolve or generate portrait"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-generate-actor"
                            checkpoint_name:
                              type: static
                              value: "actor"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ actor: results.resolve_actor_component.output.component }), checkpoints: { analysis: results.prepare_script_inputs[0].output.artifact, script: results.generate_script_plan.output.artifact } })"
                      - id: animate_actor
                        summary: "Actor component — animate portrait"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.animate-actor"
                            checkpoint_name:
                              type: static
                              value: "motion"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: results.resolve_actor.output.components, checkpoints: { actor: results.resolve_actor.output.artifact } })"
                    - summary: "Voice track"
                      modules:
                      - id: resolve_voice_component
                        summary: "Merge and validate voice component"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-voice-component"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.voice })"
                      - id: synthesize_voice
                        summary: "Voice component — speech and word timings"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.synthesize-voice"
                            checkpoint_name:
                              type: static
                              value: "voice"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ voice: results.resolve_voice_component.output.component }), checkpoints: { script: results.generate_script_plan.output.artifact } })"
              - id: lip_sync_performance
                summary: "Performance join — actor motion plus voice"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.lip-sync-performance"
                    checkpoint_name:
                      type: static
                      value: "lipsync"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ ...results.prepare_actor_voice[0].output.components, ...results.prepare_actor_voice[1].output.components }), checkpoints: { motion: results.prepare_actor_voice[0].output.artifact, voice: results.prepare_actor_voice[1].output.artifact } })"
              - id: assemble_performance
                summary: "Assemble isolated voice and lip-sync artifacts"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.assemble-performance"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ voice: results.prepare_actor_voice[1].output.artifact, lipsync: results.lip_sync_performance.output.artifact })"
          - summary: "B-roll inserts"
            modules:
              - id: resolve_broll_component
                summary: "Merge and validate broll component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-broll-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.broll })"
              - id: generate_broll
                summary: "B-roll component — timed visual inserts"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.generate-broll"
                    checkpoint_name:
                      type: static
                      value: "broll"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ broll: results.resolve_broll_component.output.component }), checkpoints: { script: results.generate_script_plan.output.artifact } })"
          - summary: "Render configuration"
            modules:
              - id: resolve_render_component
                summary: "Merge and validate render component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-render-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.render })"
    - id: composite_output
      summary: "Render join — performance, B-roll and styling"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.composite-output"
          checkpoint_name:
            type: static
            value: "composite"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ render: results.prepare_render_artifacts[2].output.component }), checkpoints: { script: results.generate_script_plan.output.artifact, voice: results.prepare_render_artifacts[0].output.performance.voice, lipsync: results.prepare_render_artifacts[0].output.performance.lipsync, broll: results.prepare_render_artifacts[1].output.artifact } })"
    - id: store_final_output
      summary: "Output component — persist draft video"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.store-final-output"
          checkpoint_name:
            type: static
            value: "store"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: results.composite_output.output.components, checkpoints: { script: results.generate_script_plan.output.artifact, composite: results.composite_output.output.artifact } })"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - template_id
    - product
    - script
    - actor
    - voice
    - broll
    - render
  properties:
    template_id:
      type: string
      title: Template (optional)
      description: Load defaults from a UGC template; every component below can override it.
    product:
      type: object
      title: Product
      additionalProperties: false
      properties:
        url:
          type: string
          title: Product URL
        brief:
          type: string
          title: Product brief
          format: textarea
        analysis:
          type: object
          title: Supplied analysis
          description: Optional structured artifact that skips product analysis.
    script:
      type: object
      title: Script
      additionalProperties: false
      properties:
        targetDurationSeconds:
          type: integer
          title: Target duration (seconds)
          minimum: 15
          maximum: 180
          default: 60
        plan:
          type: object
          title: Supplied script plan
          description: Optional hook, segments, caption and hashtags artifact that skips script generation.
    actor:
      type: object
      title: Actor
      additionalProperties: false
      properties:
        source:
          type: string
          title: Source
          enum: [generate, asset]
          default: generate
        prompt:
          type: string
          title: Portrait prompt
          format: textarea
        motionPrompt:
          type: string
          title: Motion prompt
          format: textarea
    actor_asset_collection_id:
      type: object
      format: dynselect-actor_asset_collection_id
      title: Actor portrait collection
      description: Used when Actor source is asset; each run selects one portrait from this photo collection.
    voice:
      type: object
      title: Voice
      additionalProperties: false
      properties:
        voiceId:
          type: string
          title: ElevenLabs voice ID
        model:
          type: string
          title: Voice model
          default: eleven_multilingual_v2
    broll:
      type: object
      title: B-roll
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          title: Generate B-roll
          default: true
        count:
          type: integer
          title: Images
          minimum: 0
          maximum: 6
          default: 3
    render:
      type: object
      title: Render
      additionalProperties: false
      properties:
        aspectRatio:
          type: string
          title: Aspect ratio
          enum: ["9:16", "1:1", "16:9"]
          default: "9:16"
        lipSyncTier:
          type: string
          title: Lip-sync tier
          enum: [standard, premium]
          default: standard
        captions:
          type: object
          title: Captions
        hookOverlay:
          type: object
          title: Hook overlay
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import * as wmill from \"windmill-client\"\n\nexport async function actor_asset_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const result = await wmill.runScript(\n    \"f/lumenclip/workflow_stage_runtime\",\n    null,\n    {\n      runtime_env_json: required(\"runtime_env_json\", runtimeEnv),\n      default_owner_id: required(\"default_owner_id\", defaultOwnerId),\n      stage_id: \"slideshow-generation.list-media-collection-options\",\n      stage_input: { mediaKind: kind },\n      request_id: \"media-picker-\" + crypto.randomUUID(),\n    }\n  )\n  const options = Array.isArray(result?.output?.options)\n    ? result.output.options\n    : []\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return options\n    .filter((option) => !query || option.label.toLowerCase().includes(query))\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n"
