summary: "lumenclip - UGC video generation"
description: "Generate a UGC product video through individually observable and composable stages."
value:
  modules:
    - id: load_template_defaults
      summary: "Load and validate optional UGC template defaults"
      timeout:
        type: static
        value: 300
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.load-template-defaults"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ templateId: flow_input.template_id, generationId: flow_input.generation_id, scheduledFor: flow_input.scheduled_for })"
    - id: prepare_script_inputs
      summary: "Resolve product facts while script configuration is validated"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Product resolution and analysis"
            modules:
              - id: resolve_product_component
                summary: "Merge and validate product component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-product-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.product })"
              - id: analyze_product
                summary: "Product component — analyze facts"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.analyze-product"
                    checkpoint_name:
                      type: static
                      value: "analysis"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ product: results.resolve_product_component.output.component }), checkpoints: {} })"
          - summary: "Script configuration"
            modules:
              - id: resolve_script_component
                summary: "Merge and validate script component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-script-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.script })"
    - id: generate_script_plan
      summary: "Script component — hook, body, CTA and timing"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.generate-script-plan"
          checkpoint_name:
            type: static
            value: "script"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ product: results.prepare_script_inputs[0].output.components.product, script: results.prepare_script_inputs[1].output.component }), checkpoints: { analysis: results.prepare_script_inputs[0].output.artifact } })"
    - id: prepare_render_artifacts
      summary: "Prepare performance, B-roll, and render configuration for composite"
      value:
        type: branchall
        parallel: true
        branches:
          - summary: "Actor, voice, and lip-sync performance"
            modules:
              - id: prepare_actor_voice
                summary: "Prepare actor motion and voice for their lip-sync join"
                value:
                  type: branchall
                  parallel: true
                  branches:
                    - summary: "Actor and motion"
                      modules:
                      - id: resolve_actor_component
                        summary: "Merge and validate actor component"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-actor-component"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: { ...flow_input.actor, collectionId: flow_input.actor_collection_id } })"
                      - id: resolve_actor
                        summary: "Actor component — resolve or generate portrait"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-generate-actor"
                            checkpoint_name:
                              type: static
                              value: "actor"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ actor: results.resolve_actor_component.output.component }), checkpoints: { analysis: results.prepare_script_inputs[0].output.artifact, script: results.generate_script_plan.output.artifact } })"
                      - id: animate_actor
                        summary: "Actor component — animate portrait"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.animate-actor"
                            checkpoint_name:
                              type: static
                              value: "motion"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: results.resolve_actor.output.components, checkpoints: { actor: results.resolve_actor.output.artifact } })"
                    - summary: "Voice track"
                      modules:
                      - id: resolve_voice_component
                        summary: "Merge and validate voice component"
                        timeout:
                          type: static
                          value: 300
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.resolve-voice-component"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.voice })"
                      - id: synthesize_voice
                        summary: "Voice component — speech and word timings"
                        timeout:
                          type: static
                          value: 1800
                        value:
                          type: script
                          path: f/lumenclip/workflow_stage_runtime
                          input_transforms:
                            runtime_env_json:
                              type: static
                              value: $var:f/lumenclip/runtime_env_json
                            default_owner_id:
                              type: static
                              value: $var:f/lumenclip/default_owner_id
                            stage_id:
                              type: static
                              value: "ugc-video-generation.synthesize-voice"
                            checkpoint_name:
                              type: static
                              value: "voice"
                            owner_id:
                              type: javascript
                              expr: flow_input.owner_id
                            request_id:
                              type: javascript
                              expr: flow_input.request_id
                            stage_input:
                              type: javascript
                              expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ voice: results.resolve_voice_component.output.component }), checkpoints: { script: results.generate_script_plan.output.artifact } })"
              - id: lip_sync_performance
                summary: "Performance join — actor motion plus voice"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.lip-sync-performance"
                    checkpoint_name:
                      type: static
                      value: "lipsync"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ ...results.prepare_actor_voice[0].output.components, ...results.prepare_actor_voice[1].output.components }), checkpoints: { motion: results.prepare_actor_voice[0].output.artifact, voice: results.prepare_actor_voice[1].output.artifact } })"
              - id: assemble_performance
                summary: "Assemble isolated voice and lip-sync artifacts"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.assemble-performance"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ voice: results.prepare_actor_voice[1].output.artifact, lipsync: results.lip_sync_performance.output.artifact })"
          - summary: "B-roll inserts"
            modules:
              - id: resolve_broll_component
                summary: "Merge and validate broll component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-broll-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.broll })"
              - id: generate_broll
                summary: "B-roll component — timed visual inserts"
                timeout:
                  type: static
                  value: 1800
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.generate-broll"
                    checkpoint_name:
                      type: static
                      value: "broll"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ broll: results.resolve_broll_component.output.component }), checkpoints: { script: results.generate_script_plan.output.artifact } })"
          - summary: "Render configuration"
            modules:
              - id: resolve_render_component
                summary: "Merge and validate render component"
                timeout:
                  type: static
                  value: 300
                value:
                  type: script
                  path: f/lumenclip/workflow_stage_runtime
                  input_transforms:
                    runtime_env_json:
                      type: static
                      value: $var:f/lumenclip/runtime_env_json
                    default_owner_id:
                      type: static
                      value: $var:f/lumenclip/default_owner_id
                    stage_id:
                      type: static
                      value: "ugc-video-generation.resolve-render-component"
                    owner_id:
                      type: javascript
                      expr: flow_input.owner_id
                    request_id:
                      type: javascript
                      expr: flow_input.request_id
                    stage_input:
                      type: javascript
                      expr: "({ generation: results.load_template_defaults.output.generation, templateDefaults: results.load_template_defaults.output.templateDefaults, override: flow_input.render })"
    - id: composite_output
      summary: "Render join — performance, B-roll and styling"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.composite-output"
          checkpoint_name:
            type: static
            value: "composite"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: ({ render: results.prepare_render_artifacts[2].output.component }), checkpoints: { script: results.generate_script_plan.output.artifact, voice: results.prepare_render_artifacts[0].output.performance.voice, lipsync: results.prepare_render_artifacts[0].output.performance.lipsync, broll: results.prepare_render_artifacts[1].output.artifact } })"
    - id: store_final_output
      summary: "Output component — persist draft video"
      timeout:
        type: static
        value: 1800
      value:
        type: script
        path: f/lumenclip/workflow_stage_runtime
        input_transforms:
          runtime_env_json:
            type: static
            value: $var:f/lumenclip/runtime_env_json
          default_owner_id:
            type: static
            value: $var:f/lumenclip/default_owner_id
          stage_id:
            type: static
            value: "ugc-video-generation.store-final-output"
          checkpoint_name:
            type: static
            value: "store"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "({ componentExecution: true, generation: results.load_template_defaults.output.generation, ...results.load_template_defaults.output.generation, components: results.composite_output.output.components, checkpoints: { script: results.generate_script_plan.output.artifact, composite: results.composite_output.output.artifact } })"
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  x-lumenclip-hide-input-node: true
  order:
    - template_id
    - product
    - script
    - actor
    - voice
    - broll
    - render
  properties:
    template_id:
      type: string
      format: dynselect-template_id
      title: Template (optional)
      description: Load defaults from a UGC template; every component below can override it.
    product:
      type: object
      title: Product
      additionalProperties: false
      properties:
        url:
          type: string
          title: Product URL
        brief:
          type: string
          title: Product brief
          format: textarea
    script:
      type: object
      title: Script
      additionalProperties: false
      properties:
        targetDurationSeconds:
          type: integer
          title: Target duration (seconds)
          minimum: 15
          maximum: 180
          default: 60
    actor:
      type: object
      title: Actor
      additionalProperties: false
      properties:
        source:
          type: string
          title: Source
          enum: [generate, collection]
          default: generate
        prompt:
          type: string
          title: Portrait prompt
          format: textarea
        motionPrompt:
          type: string
          title: Motion prompt
          format: textarea
    actor_collection_id:
      type: object
      format: dynselect-actor_collection_id
      title: Actor portrait collection
      description: Used when Actor source is collection; each run selects one portrait from this photo collection.
    voice:
      type: object
      title: Voice
      additionalProperties: false
      properties:
        voiceId:
          type: string
          title: ElevenLabs voice ID
        model:
          type: string
          title: Voice model
          default: eleven_multilingual_v2
    broll:
      type: object
      title: B-roll
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          title: Generate B-roll
          default: true
        count:
          type: integer
          title: Images
          minimum: 0
          maximum: 6
          default: 3
    render:
      type: object
      title: Render
      additionalProperties: false
      properties:
        aspectRatio:
          type: string
          title: Aspect ratio
          enum: ["9:16", "1:1", "16:9"]
          default: "9:16"
        lipSyncTier:
          type: string
          title: Lip-sync tier
          enum: [standard, premium]
          default: standard
        captions:
          type: object
          title: Captions
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              title: Show captions
              default: true
            style:
              type: string
              title: Caption style
              default: karaoke
            fallback:
              type: string
              title: Caption renderer
              enum: [drawtext, png_frames]
              default: drawtext
        hookOverlay:
          type: object
          title: Hook overlay
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              title: Show hook overlay
              default: true
            durationMs:
              type: integer
              title: Duration (milliseconds)
              minimum: 500
              maximum: 10000
              default: 3000
            style:
              type: string
              title: Overlay style
              default: bold
  x-windmill-dyn-select-lang: bun
  x-windmill-dyn-select-code: "import { Client, Query, TablesDB } from \"node-appwrite\"\nimport * as wmill from \"windmill-client\"\n\nexport async function template_id(filterText = \"\") {\n  return templateOptions({\"table\":\"templates\",\"automationKind\":\"ugc\"}, filterText)\n}\n\nexport async function actor_collection_id(filterText = \"\") {\n  return mediaCollections(\"image\", filterText)\n}\n\nasync function templateOptions(config: {\n  table: \"templates\" | \"social_templates\"\n  automationKind?: string\n  videoFormat?: string\n  excludedVideoFormats?: string[]\n  platforms?: string[]\n}, filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    config.table === \"templates\"\n      ? [\"templates\", \"automations\"]\n      : [\"social_templates\", \"x_automations\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)]\n  )\n  const query = clean(filterText).toLowerCase()\n  return response.rows.flatMap((row) => {\n    const record = parseRecord(row.data)\n    if (!record || record.hidden === true || record.deletedAt) return []\n    const schema = parseRecord(record.schema) || {}\n    const automationKind = clean(schema.automationKind)\n    const videoFormat = clean(parseRecord(schema.video_format)?.template)\n    const platform = clean(record.platform)\n    if (config.automationKind && automationKind !== config.automationKind) return []\n    if (config.videoFormat && videoFormat !== config.videoFormat) return []\n    if (config.excludedVideoFormats?.includes(videoFormat)) return []\n    if (config.platforms?.length && !config.platforms.includes(platform)) return []\n    const value = clean(record.id) || clean(row.rid)\n    const name = clean(record.name)\n    if (!value || !name) return []\n    const detail = platform || videoFormat.replaceAll(\"_\", \" \") || automationKind\n    const label = detail ? name + \" · \" + detail : name\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{ value, label }]\n  })\n}\n\nasync function hookOptions(templateId = \"\", filterText = \"\") {\n  const id = clean(templateId)\n  if (!id) return []\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"templates\", \"automations\"],\n    [\n      Query.equal(\"owner_id\", [ownerId]),\n      Query.equal(\"rid\", [id]),\n      Query.limit(1),\n    ]\n  )\n  const record = parseRecord(response.rows[0]?.data)\n  const schema = parseRecord(record?.schema)\n  const hooks = Array.isArray(schema?.hooks) ? schema.hooks : []\n  const query = clean(filterText).toLowerCase()\n  return hooks.flatMap((candidate) => {\n    const hook = parseRecord(candidate)\n    const text = clean(hook?.text)\n    if (!text || hook?.enabled === false) return []\n    if (query && !text.toLowerCase().includes(query)) return []\n    return [{ value: text, label: text }]\n  })\n}\n\nasync function mediaCollections(kind: \"video\" | \"image\", filterText = \"\") {\n  const { tables, databaseId, ownerId } = await appwrite()\n  const response = await listRowsWithFallback(\n    tables,\n    databaseId,\n    [\"permanent_assets\", \"image_collections\"],\n    [Query.equal(\"owner_id\", [ownerId]), Query.limit(100)],\n    { permanent_assets: Query.equal(\"source_key\", [\"image_collection\"]) }\n  )\n  const query = String(filterText || \"\").trim().toLowerCase()\n  return response.rows.flatMap((row) => {\n    const collection = parseRecord(row.data)\n    if (!collection || collection.deletedAt) return []\n    const mediaKind = collection.mediaType === \"video\" ? \"video\" : \"image\"\n    const assetCount = Array.isArray(collection.images)\n      ? collection.images.filter((asset) => clean(asset?.image_link)).length\n      : 0\n    const name = clean(collection.name)\n    if (!name || !assetCount || mediaKind !== kind) return []\n    const label = name + \" (\" + assetCount + \")\"\n    if (query && !label.toLowerCase().includes(query)) return []\n    return [{\n      value: clean(collection.id) || clean(collection.externalId) || slug(name),\n      label,\n      mediaKind,\n      assetCount,\n    }]\n  })\n}\n\nasync function listRowsWithFallback(\n  tables: TablesDB,\n  databaseId: string,\n  tableIds: string[],\n  queries: string[],\n  tableQueries: Record<string, string> = {}\n) {\n  for (const tableId of tableIds) {\n    try {\n      return await tables.listRows(databaseId, tableId, [\n        ...queries,\n        ...(tableQueries[tableId] ? [tableQueries[tableId]] : []),\n      ])\n    } catch (error) {\n      if (Number((error as { code?: unknown })?.code) !== 404) throw error\n    }\n  }\n  throw new Error(\"No compatible LumenClip Appwrite table was found\")\n}\n\nasync function appwrite() {\n  const [runtimeEnv, defaultOwnerId] = await Promise.all([\n    wmill.getVariable(\"f/lumenclip/runtime_env_json\"),\n    wmill.getVariable(\"f/lumenclip/default_owner_id\"),\n  ])\n  const env = JSON.parse(required(\"runtime_env_json\", runtimeEnv))\n  const client = new Client()\n    .setEndpoint(required(\"APPWRITE_ENDPOINT\", env.APPWRITE_ENDPOINT))\n    .setProject(required(\"APPWRITE_PROJECT_ID\", env.APPWRITE_PROJECT_ID))\n    .setKey(required(\"APPWRITE_API_KEY\", env.APPWRITE_API_KEY))\n  return {\n    tables: new TablesDB(client),\n    databaseId: required(\"APPWRITE_DATABASE_ID\", env.APPWRITE_DATABASE_ID),\n    ownerId: required(\"default_owner_id\", defaultOwnerId),\n  }\n}\n\nfunction required(name: string, value: unknown) {\n  const text = typeof value === \"string\" ? value.trim() : \"\"\n  if (!text) throw new Error(\"Lumenclip variable \" + name + \" is not configured\")\n  return text\n}\n\nfunction parseRecord(value: unknown): Record<string, any> | null {\n  if (value && typeof value === \"object\" && !Array.isArray(value)) {\n    return value as Record<string, any>\n  }\n  if (typeof value !== \"string\") return null\n  try {\n    const parsed = JSON.parse(value)\n    return parsed && typeof parsed === \"object\" ? parsed : null\n  } catch {\n    return null\n  }\n}\n\nfunction clean(value: unknown) {\n  return typeof value === \"string\" ? value.trim() : \"\"\n}\n\nfunction slug(value: string) {\n  return value.toLowerCase().replace(/[^a-z0-9]+/g, \"-\").replace(/^-|-$/g, \"\")\n}\n"
