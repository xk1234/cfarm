summary: "lumenclip - UGC video generation"
description: "Generate a UGC product video through individually observable and composable stages."
value:
  modules:
    - id: analyze_product
      summary: "Analyze product"
      skip_if:
        expr: flow_input.start_at && ["ugc-video-generation.analyze-product","ugc-video-generation.generate-script-plan","ugc-video-generation.resolve-generate-actor","ugc-video-generation.synthesize-voice","ugc-video-generation.animate-actor","ugc-video-generation.lip-sync-performance","ugc-video-generation.generate-broll","ugc-video-generation.composite-output","ugc-video-generation.store-final-output"].indexOf(flow_input.start_at) > 0
      stop_after_if:
        expr: result.status === "running" || flow_input.stop_after === "ugc-video-generation.analyze-product"
        skip_if_stopped: false
      value:
        type: script
        path: f/lumenclip/run_pipeline_stage
        input_transforms:
          stage_id:
            type: static
            value: "ugc-video-generation.analyze-product"
          owner_id:
            type: javascript
            expr: flow_input.owner_id
          request_id:
            type: javascript
            expr: flow_input.request_id
          stage_input:
            type: javascript
            expr: "flow_input.input ?? { automationId: flow_input.automation_id }"
    - id: generate_script_plan
