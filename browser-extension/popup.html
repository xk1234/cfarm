<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumenClip companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" alt="" width="24" height="24" />
        <span id="context">LumenClip companion</span>
      </header>

      <section class="task-intro">
        <div id="pageIdentity" class="page-identity"></div>
        <h1 id="screenTitle">Checking this page…</h1>
        <p id="screenDescription"></p>
      </section>

      <ol id="steps" class="steps"></ol>

      <div id="status" class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Checking…</span>
      </div>

      <section id="commentsReview" class="review" hidden>
        <div class="review-heading">
          <div>
            <div class="eyebrow">Reply review</div>
            <h1>Comments and drafts</h1>
          </div>
          <span id="reviewCount" class="count"></span>
        </div>
        <p id="reviewSummary" class="review-summary"></p>
        <div id="commentList" class="comment-list"></div>
        <div class="review-actions">
          <button id="draftReplies" class="secondary" hidden>
            Draft replies
          </button>
          <button id="approveAll" class="secondary" hidden>Approve all</button>
          <button id="sendApproved" hidden>Send approved</button>
        </div>
      </section>

      <div class="actions">
        <button id="connect" class="primary" hidden>Connect</button>
        <button id="sync" class="primary" hidden>Sync now</button>
        <button id="reconnect" class="secondary" hidden>Reconnect</button>
        <button id="clear" class="secondary" hidden>Clear pairing</button>
        <button id="openSupported" class="primary" hidden>
          Open TikTok Studio
        </button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
