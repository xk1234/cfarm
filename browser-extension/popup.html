<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumenClip companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" alt="" width="24" height="24" />
        <span id="context">LumenClip companion</span>
      </header>

      <div id="status" class="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Checking…</span>
      </div>

      <div class="actions">
        <button id="connect" class="primary" hidden>Connect</button>
        <button id="sync" class="primary" hidden>Sync now</button>
        <button id="reconnect" class="secondary" hidden>Reconnect</button>
        <button id="clear" class="secondary" hidden>Clear pairing</button>
      </div>

      <button id="switch" class="link" hidden></button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
