<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumenClip companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon48.png" alt="" width="24" height="24" />
        <span>LumenClip companion</span>
      </header>

      <section class="feature">
        <div class="feature-title">Studio analytics</div>

        <div id="studioStatus" class="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="studioStatusText">Checking…</span>
        </div>

        <div class="actions">
          <button id="studioPair" class="primary" hidden>Connect</button>
          <button id="studioSync" class="primary" hidden>Sync now</button>
          <button id="studioReconnect" class="secondary" hidden>
            Reconnect
          </button>
          <button id="studioClear" class="secondary" hidden>
            Clear pairing
          </button>
        </div>
      </section>

      <section class="feature">
        <div class="feature-title">Comments</div>

        <div id="commentsStatus" class="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="commentsStatusText">Checking…</span>
        </div>

        <div class="actions">
          <button id="commentsPair" class="primary" hidden>Connect</button>
          <button id="commentsSync" class="primary" hidden>Sync now</button>
          <button id="commentsReconnect" class="secondary" hidden>
            Reconnect
          </button>
          <button id="commentsClear" class="secondary" hidden>
            Clear pairing
          </button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
